name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify generated site entry points
        run: |
          test -f html/index.html
          test -f html/404.html
          test -f html/.nojekyll
          test -f html/assets/site.css

      - name: Reject root-absolute asset links
        run: |
          if grep -rnoE '(href|src)="/[^"]*' --include='*.html' html \
             | grep -vE '(href|src)="/lecture/'; then
            echo "root-absolute link found; Pages base path is /lecture/" >&2
            exit 1
          fi
          echo "no root-absolute links"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: html

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
