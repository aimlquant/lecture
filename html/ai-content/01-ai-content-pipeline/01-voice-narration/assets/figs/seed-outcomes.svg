  </g>
  <g>
    <rect class="ok" x="240" y="30" width="56" height="40" rx="3"/>
    <text class="sd" x="268" y="20" text-anchor="middle">1</text>
    <text class="rs rok" x="268" y="56" text-anchor="middle">정확</text>
  </g>
  <g>
    <rect class="ok" x="302" y="30" width="56" height="40" rx="3"/>
    <text class="sd" x="330" y="20" text-anchor="middle">42</text>
    <text class="rs rok" x="330" y="56" text-anchor="middle">정확</text>
  </g>
  <g>
    <rect class="bad" x="364" y="30" width="56" height="40" rx="3"/>
    <text class="sd" x="392" y="20" text-anchor="middle">99</text>
    <text class="rs rbad" x="392" y="56" text-anchor="middle">실패</text>
    <text class="q" x="392" y="104" text-anchor="middle">상지초</text>
  </g>
  <g>
    <rect class="ok" x="426" y="30" width="66" height="40" rx="3"/>
    <text class="sd" x="459" y="20" text-anchor="middle">1234</text>
    <text class="rs rok" x="459" y="56" text-anchor="middle">정확</text>
  </g>
  <g>
    <rect class="bad" x="498" y="30" width="66" height="40" rx="3"/>
    <text class="sd" x="531" y="20" text-anchor="middle">5555</text>
    <text class="rs rbad" x="531" y="56" text-anchor="middle">실패</text>
    <text class="q" x="531" y="104" text-anchor="middle">3지초</text>
  </g>
