    <rect class="ok" x="570" y="30" width="76" height="40" rx="3"/>
    <text class="sd" x="608" y="20" text-anchor="middle">31337</text>
    <text class="rs rok" x="608" y="56" text-anchor="middle">정확</text>
  </g>

  <line x1="76" y1="130" x2="646" y2="130" stroke="#dfe2e7" stroke-width="1"/>
  <text class="rs rok" x="76" y="152">정확 5</text>
  <text class="rs rbad" x="160" y="152">실패 3</text>
