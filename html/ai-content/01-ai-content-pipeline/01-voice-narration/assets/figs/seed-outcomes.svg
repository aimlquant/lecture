<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 176" role="img" aria-labelledby="t3">
  <title id="t3">같은 문장을 시드 여덟 개로 생성한 결과</title>
  <defs>
    <style>
      .ok   { fill:#e4efe8; stroke:#2c6e4a; stroke-width:2; }
      .bad  { fill:#f8ece5; stroke:#a32f3c; stroke-width:2; }
      .sd   { font:700 12px ui-monospace,monospace; fill:#101114; }
      .rs   { font:700 13px Inter,"Noto Sans KR",sans-serif; }
      .rok  { fill:#2c6e4a; }
      .rbad { fill:#a32f3c; }
      .hd   { font:700 12.5px Inter,"Noto Sans KR",sans-serif; fill:#5a6472; }
      .q    { font:400 12px ui-monospace,monospace; fill:#a32f3c; }
    </style>
  </defs>

  <text class="hd" x="14" y="20">시드</text>
  <text class="hd" x="14" y="62">결과</text>
  <text class="hd" x="14" y="104">들린 것</text>

  <g>
    <rect class="bad" x="76" y="30" width="76" height="40" rx="3"/>
    <text class="sd" x="114" y="20" text-anchor="middle">20260823</text>
    <text class="rs rbad" x="114" y="56" text-anchor="middle">실패</text>
    <text class="q" x="114" y="104" text-anchor="middle">상지추</text>
  </g>
  <g>
    <rect class="ok" x="158" y="30" width="76" height="40" rx="3"/>
    <text class="sd" x="196" y="20" text-anchor="middle">20260824</text>
