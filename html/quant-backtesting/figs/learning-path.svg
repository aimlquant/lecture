<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" role="img" aria-labelledby="lp-title">
  <title id="lp-title">초급 여섯 과정을 순서대로 마친 뒤 다섯 갈래로 나뉘고, 팩터와 리스크가 포트폴리오로 모이는 학습 경로</title>
  <defs>
    <marker id="lp-arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <path d="M0 0L10 4L0 8z" fill="#0f2c59"/>
    </marker>
    <marker id="lp-arrow-soft" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <path d="M0 0L10 4L0 8z" fill="#8a94a6"/>
    </marker>
    <style>
      .bg   { fill:#fafaf9 }
      .base { fill:#0f2c59 }
      .pick { fill:#ffffff; stroke:#0f2c59; stroke-width:2 }
      .next { fill:#f3f5f8; stroke:#c3cbd8; stroke-width:1.5 }
      .goal { fill:#e4efe8; stroke:#2c6e4a; stroke-width:2 }
      .dot  { fill:#ffffff; fill-opacity:.22 }
      .num  { font:700 13px Inter,"Noto Sans KR",sans-serif; fill:#ffffff }
      .kw   { font:700 13px Inter,"Noto Sans KR",sans-serif; fill:#ffffff }
      .kd   { font:700 13px Inter,"Noto Sans KR",sans-serif; fill:#0f2c59 }
      .hw   { font:800 20px Inter,"Noto Sans KR",sans-serif; fill:#ffffff }
      .hd   { font:800 16px Inter,"Noto Sans KR",sans-serif; fill:#101114 }
      .hg   { font:800 17px Inter,"Noto Sans KR",sans-serif; fill:#1f5c3d }
      .sm   { font:500 12px Inter,"Noto Sans KR",sans-serif; fill:#6b7482 }
      .arw  { stroke:#0f2c59; stroke-width:2.5; fill:none; marker-end:url(#lp-arrow) }
      .arws { stroke:#8a94a6; stroke-width:2; fill:none; marker-end:url(#lp-arrow-soft) }
    </style>
  </defs>
  <rect class="bg" width="960" height="452"/>

  <!-- 초급: 순서대로 -->
  <rect class="base" x="24" y="118" width="212" height="216" rx="14"/>
  <text class="kw" x="52" y="154">STEP 1</text>
  <text class="hw" x="52" y="182">초급 6과정</text>
  <text class="kw" x="52" y="208" fill="#aebbd2">순서대로 듣습니다</text>
  <circle class="dot" cx="66" cy="252" r="15"/><text class="num" x="66" y="257" text-anchor="middle">1</text>
  <circle class="dot" cx="103" cy="252" r="15"/><text class="num" x="103" y="257" text-anchor="middle">2</text>
  <circle class="dot" cx="140" cy="252" r="15"/><text class="num" x="140" y="257" text-anchor="middle">3</text>
  <circle class="dot" cx="177" cy="252" r="15"/><text class="num" x="177" y="257" text-anchor="middle">4</text>
  <circle class="dot" cx="66" cy="296" r="15"/><text class="num" x="66" y="301" text-anchor="middle">5</text>
  <circle class="dot" cx="103" cy="296" r="15"/><text class="num" x="103" y="301" text-anchor="middle">6</text>
  <text class="kw" x="130" y="301" fill="#aebbd2">첫 백테스트까지</text>

  <!-- 분기 다섯 -->
  <rect class="pick" x="330" y="26"  width="222" height="62" rx="12"/>
  <text class="hd" x="352" y="52">평균회귀</text><text class="sm" x="352" y="72">→ 시계열 모델로 이어집니다</text>
  <rect class="pick" x="330" y="106" width="222" height="62" rx="12"/>
  <text class="hd" x="352" y="132">모멘텀</text><text class="sm" x="352" y="152">→ 시장별 특성으로 이어집니다</text>
  <rect class="pick" x="330" y="186" width="222" height="62" rx="12"/>
  <text class="hd" x="352" y="212">팩터 모델</text><text class="sm" x="352" y="232">→ 머신러닝으로 이어집니다</text>
  <rect class="pick" x="330" y="266" width="222" height="62" rx="12"/>
  <text class="hd" x="352" y="292">리스크 관리</text><text class="sm" x="352" y="312">→ 변동성으로 이어집니다</text>
  <rect class="pick" x="330" y="346" width="222" height="62" rx="12"/>
  <text class="hd" x="352" y="372">시장 미시구조</text><text class="sm" x="352" y="392">호가창과 주문흐름</text>

  <text class="kd" x="330" y="436">STEP 2 · 관심 있는 것부터 골라 듣습니다</text>

  <!-- 초급 → 분기 -->
  <path class="arw" d="M236 226H274V57H326"/>
  <path class="arw" d="M236 226H274V137H326"/>
  <path class="arw" d="M236 226H326"/>
  <path class="arw" d="M236 226H274V297H326"/>
  <path class="arw" d="M236 226H274V377H326"/>

  <!-- 포트폴리오 -->
  <rect class="goal" x="662" y="186" width="274" height="88" rx="14"/>
  <text class="hg" x="690" y="222">포트폴리오로 묶기</text>
  <text class="sm" x="690" y="248" fill="#2c6e4a">검증을 통과한 전략 둘 이상</text>


  <text class="kd" x="662" y="300">STEP 3 · 마지막에 하나로</text>
  <path class="arws" d="M552 217H658"/>
  <path class="arws" d="M552 297H608V243H658"/>
</svg>
