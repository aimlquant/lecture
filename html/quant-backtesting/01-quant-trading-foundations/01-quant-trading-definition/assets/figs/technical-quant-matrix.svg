<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">기술적 분석과 퀀트 트레이딩의 관계 지도</title>
  <desc id="desc">가로축은 입력 자료가 가격과 거래량에서 재무와 뉴스로 넓어지는 방향이고, 세로축은 사람의 해석이 남는 판단에서 명시적 규칙으로 바뀌는 방향이다.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto">
      <path d="M0 0L18 5L0 10Z" fill="context-stroke"/>
    </marker>
    <clipPath id="grid-clip"><rect x="180" y="72" width="900" height="560" rx="12"/></clipPath>
    <style>
      text { font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif; fill:#0F172A; }
      .eyebrow { font-size:20px; font-weight:700; letter-spacing:1.2px; }
      .title { font-size:34px; font-weight:700; }
      .body { font-size:26px; font-weight:400; fill:#52606D; }
      .axis-label { font-size:24px; font-weight:700; fill:#0F2C59; }
      .axis { fill:none; stroke:#0F2C59; stroke-width:3; stroke-linecap:round; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#FFFFFF"/>

  <g clip-path="url(#grid-clip)">
    <rect x="180" y="72" width="450" height="280" fill="#E7EEF9"/>
    <rect x="630" y="72" width="450" height="280" fill="#E4F6F0"/>
    <rect x="180" y="352" width="450" height="280" fill="#FFF1F4"/>
    <rect x="630" y="352" width="450" height="280" fill="#FFFFFF"/>
  </g>
  <rect x="180" y="72" width="900" height="560" rx="12" fill="none" stroke="#C7D2E1" stroke-width="1.5"/>
  <path d="M630 72V632M180 352H1080" fill="none" stroke="#C7D2E1" stroke-width="1.5"/>

  <g>
    <text class="eyebrow" x="216" y="118" fill="#0F2C59">교집합</text>
    <text class="title" x="216" y="169">기술적 분석 + 퀀트</text>
    <text class="body" x="216" y="217">수치로 정의한 이동평균 교차</text>
    <text class="body" x="216" y="257">매매 조건을 컴퓨터가 판정</text>
    <text class="body" x="216" y="297">두 영역이 겹치는 경우</text>
  </g>

  <g>
    <text class="eyebrow" x="666" y="118" fill="#0B7A6A">가격 외 데이터</text>
    <text class="title" x="666" y="169">퀀트 · 가격 외 입력</text>
    <text class="body" x="666" y="217">매출 성장률 · 부채비율</text>
    <text class="body" x="666" y="257">뉴스 분류 결과</text>
    <text class="body" x="666" y="297">가격 외 데이터도 활용</text>
  </g>

  <g>
    <text class="eyebrow" x="216" y="398" fill="#BE123C">아직 퀀트는 아님</text>
    <text class="title" x="216" y="449">재량적 기술적 분석</text>
    <text class="body" x="216" y="497">눈으로 찾는 헤드 앤 숄더</text>
    <text class="body" x="216" y="537">분석자마다 패턴 판단이 다름</text>
    <text class="body" x="216" y="577">명시적 조건이 필요</text>
  </g>

  <g>
    <text class="eyebrow" x="666" y="398" fill="#52606D">재량 판단</text>
    <text class="title" x="666" y="449">둘 다 아님</text>
    <text class="body" x="666" y="497">“경영진 인상이 좋아 보인다”</text>
    <text class="body" x="666" y="537">자료와 규칙이 모두 없음</text>
    <text class="body" x="666" y="577">사람의 인상에 의존</text>
  </g>

  <path class="axis" d="M180 682H1080"/>
  <text class="axis-label" x="630" y="730" text-anchor="middle">입력 범위: 가격·거래량 → 재무·뉴스 등</text>

  <path class="axis" d="M132 632V72"/>
  <text class="axis-label" x="72" y="352" text-anchor="middle" transform="rotate(-90 72 352)">판단 방식: 주관적 해석 → 수치로 정의한 조건</text>
</svg>
