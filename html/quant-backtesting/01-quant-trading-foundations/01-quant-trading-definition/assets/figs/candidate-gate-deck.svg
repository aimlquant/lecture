<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 528" role="img" aria-labelledby="title desc">
  <title id="title">투자 아이디어를 검증 가능한 퀀트 전략 후보로 바꾸는 네 관문</title>
  <desc id="desc">투자 아이디어가 입력, 규칙, 행동, 과거 재현 관문을 차례로 통과한다. 각 관문에서 조건을 충족하지 못하면 바로 아래 보완 항목으로 내려가고, 네 관문을 모두 통과하면 검증 가능한 퀀트 전략 후보가 된다.</desc>
  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto">
      <path d="M0 0L18 5L0 10Z" fill="#0F2C59"/>
    </marker>
    <marker id="arrow-red" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto">
      <path d="M0 0L18 5L0 10Z" fill="#BE123C"/>
    </marker>
    <marker id="arrow-teal" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto">
      <path d="M0 0L18 5L0 10Z" fill="#0B7A6A"/>
    </marker>
    <style>
      text { font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif; fill:#0F172A; }
      .eyebrow { font-size:16px; font-weight:700; letter-spacing:1px; fill:#52606D; }
      .start { font-size:23px; font-weight:700; }
      .gate-title { font-size:22px; font-weight:700; fill:#0F2C59; }
      .question { font-size:18px; font-weight:600; }
      .branch { font-size:16px; font-weight:700; paint-order:stroke fill; stroke:#FFFFFF; stroke-width:5px; stroke-linejoin:round; }
      .repair-title { font-size:18px; font-weight:700; fill:#BE123C; }
      .repair-body { font-size:16px; font-weight:500; fill:#52606D; }
      .result { font-size:28px; font-weight:700; fill:#0B7A6A; }
      .gate { fill:#FFFFFF; stroke:#C7D2E1; stroke-width:1.5; }
      .repair { fill:#FFF1F4; stroke:#BE123C; stroke-width:1.5; }
      .flow { fill:none; stroke:#0F2C59; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow-blue); }
      .fail-flow { fill:none; stroke:#BE123C; stroke-width:3; stroke-linecap:round; marker-end:url(#arrow-red); }
      .pass-flow { fill:none; stroke:#0B7A6A; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow-teal); }
    </style>
  </defs>
  <rect width="1200" height="528" fill="#FFFFFF"/>

  <rect x="20" y="52" width="140" height="96" rx="48" fill="#E7EEF9" stroke="#C7D2E1" stroke-width="1.5"/>
  <text class="eyebrow" x="90" y="82" text-anchor="middle">START</text>
  <text class="start" x="90" y="112" text-anchor="middle">투자 아이디어</text>
  <text class="eyebrow" x="90" y="136" text-anchor="middle">한 문장</text>

  <path class="flow" d="M160 100H200"/>
  <text class="branch" x="180" y="88" text-anchor="middle" fill="#0F2C59">시작</text>

  <g>
    <rect class="gate" x="200" y="32" width="190" height="136" rx="12"/>
    <text class="eyebrow" x="295" y="61" text-anchor="middle">GATE 1 · INPUT</text>
    <text class="gate-title" x="295" y="91" text-anchor="middle">입력</text>
    <text class="question" x="295" y="121" text-anchor="middle">어떤 자료를</text>
    <text class="question" x="295" y="146" text-anchor="middle">언제 읽는가?</text>
    <path class="fail-flow" d="M295 168V250"/>
    <text class="branch" x="313" y="214" fill="#BE123C">아니오</text>
    <rect class="repair" x="200" y="250" width="190" height="110" rx="12"/>
    <text class="repair-title" x="295" y="284" text-anchor="middle">사람의 인상</text>
    <text class="repair-body" x="295" y="314" text-anchor="middle">자료와 기준 시점을</text>
    <text class="repair-body" x="295" y="337" text-anchor="middle">먼저 정한다</text>
  </g>

  <path class="flow" d="M390 100H440"/>
  <text class="branch" x="415" y="88" text-anchor="middle" fill="#0F2C59">예</text>

  <g>
    <rect class="gate" x="440" y="32" width="190" height="136" rx="12"/>
    <text class="eyebrow" x="535" y="61" text-anchor="middle">GATE 2 · RULE</text>
    <text class="gate-title" x="535" y="91" text-anchor="middle">규칙</text>
    <text class="question" x="535" y="121" text-anchor="middle">조건을 수치로</text>
    <text class="question" x="535" y="146" text-anchor="middle">정의했는가?</text>
    <path class="fail-flow" d="M535 168V250"/>
    <text class="branch" x="553" y="214" fill="#BE123C">아니오</text>
    <rect class="repair" x="440" y="250" width="190" height="110" rx="12"/>
    <text class="repair-title" x="535" y="284" text-anchor="middle">모호한 조건</text>
    <text class="repair-body" x="535" y="314" text-anchor="middle">수치와 논리로</text>
    <text class="repair-body" x="535" y="337" text-anchor="middle">구체화한다</text>
  </g>

  <path class="flow" d="M630 100H680"/>
  <text class="branch" x="655" y="88" text-anchor="middle" fill="#0F2C59">예</text>

  <g>
    <rect class="gate" x="680" y="32" width="190" height="136" rx="12"/>
    <text class="eyebrow" x="775" y="61" text-anchor="middle">GATE 3 · ACTION</text>
    <text class="gate-title" x="775" y="91" text-anchor="middle">행동</text>
    <text class="question" x="775" y="121" text-anchor="middle">매수·매도·보유가</text>
    <text class="question" x="775" y="146" text-anchor="middle">정해지는가?</text>
    <path class="fail-flow" d="M775 168V250"/>
    <text class="branch" x="793" y="214" fill="#BE123C">아니오</text>
    <rect class="repair" x="680" y="250" width="190" height="110" rx="12"/>
    <text class="repair-title" x="775" y="284" text-anchor="middle">거래 행동이 없음</text>
    <text class="repair-body" x="775" y="314" text-anchor="middle">매수·매도·보유까지</text>
    <text class="repair-body" x="775" y="337" text-anchor="middle">정한다</text>
  </g>

  <path class="flow" d="M870 100H920"/>
  <text class="branch" x="895" y="88" text-anchor="middle" fill="#0F2C59">예</text>

  <g>
    <rect class="gate" x="920" y="32" width="190" height="136" rx="12"/>
    <text class="eyebrow" x="1015" y="61" text-anchor="middle">GATE 4 · REPLAY</text>
    <text class="gate-title" x="1015" y="91" text-anchor="middle">과거 재현</text>
    <text class="question" x="1015" y="121" text-anchor="middle">같은 규칙을 과거에</text>
    <text class="question" x="1015" y="146" text-anchor="middle">다시 적용하는가?</text>
    <path class="fail-flow" d="M1015 168V250"/>
    <text class="branch" x="1033" y="214" fill="#BE123C">아니오</text>
    <rect class="repair" x="920" y="250" width="190" height="110" rx="12"/>
    <text class="repair-title" x="1015" y="284" text-anchor="middle">과거 검증 불가</text>
    <text class="repair-body" x="1015" y="314" text-anchor="middle">당시 자료와 시점을</text>
    <text class="repair-body" x="1015" y="337" text-anchor="middle">복원한다</text>
  </g>

  <path class="pass-flow" d="M1110 100H1165V455H1110"/>
  <text class="branch" x="1162" y="207" text-anchor="end" fill="#0B7A6A">예</text>
  <rect x="200" y="414" width="910" height="82" rx="41" fill="#E4F6F0" stroke="#0B7A6A" stroke-width="1.5"/>
  <text class="eyebrow" x="655" y="445" text-anchor="middle" fill="#0B7A6A">FOUR GATES PASSED</text>
  <text class="result" x="655" y="480" text-anchor="middle">검증 가능한 퀀트 전략 후보</text>
</svg>
