<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 936" role="img" aria-labelledby="title desc">
  <title id="title">투자 아이디어를 검증 가능한 퀀트 전략 후보로 바꾸는 네 관문</title>
  <desc id="desc">입력, 규칙, 행동, 과거 검증 관문을 모두 통과하면 검증 가능한 퀀트 전략 후보가 되고, 각 관문에서 실패하면 부족한 내용을 보완한다.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto">
      <path d="M0 0L18 5L0 10Z" fill="context-stroke"/>
    </marker>
    <style>
      text { font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif; fill:#0F172A; }
      .eyebrow { font-size:20px; font-weight:700; letter-spacing:1.2px; fill:#52606D; }
      .question { font-size:26px; font-weight:700; }
      .branch { font-size:22px; font-weight:700; paint-order:stroke fill; stroke:#FFFFFF; stroke-width:5px; stroke-linejoin:round; }
      .fail-title { font-size:26px; font-weight:700; fill:#BE123C; }
      .fail-body { font-size:22px; font-weight:400; fill:#52606D; }
      .hero { font-size:34px; font-weight:700; fill:#0B7A6A; }
      .gate { fill:#FFFFFF; stroke:#C7D2E1; stroke-width:1.5; }
      .flow { fill:none; stroke:#0F2C59; stroke-width:3; stroke-linecap:round; marker-end:url(#arrow); }
      .fail-flow { fill:none; stroke:#BE123C; stroke-width:3; stroke-linecap:round; marker-end:url(#arrow); }
      .pass-flow { fill:none; stroke:#0B7A6A; stroke-width:3; stroke-linecap:round; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="936" fill="#FFFFFF"/>

  <rect x="84" y="24" width="576" height="72" rx="36" fill="#E7EEF9" stroke="#C7D2E1" stroke-width="1.5"/>
  <text class="eyebrow" x="372" y="51" text-anchor="middle">START</text>
  <text class="question" x="372" y="82" text-anchor="middle">투자 아이디어를 한 문장으로</text>

  <path class="flow" d="M372 96V168"/>
  <text class="branch" x="392" y="139" fill="#0F2C59">예</text>

  <g>
    <rect class="gate" x="84" y="168" width="576" height="96" rx="12"/>
    <text class="eyebrow" x="372" y="199" text-anchor="middle">GATE 1 · INPUT</text>
    <text class="question" x="372" y="237" text-anchor="middle">어떤 자료를 언제 읽는지 적을 수 있나?</text>
    <path class="fail-flow" d="M660 216H804"/>
    <text class="branch" x="732" y="201" text-anchor="middle" fill="#BE123C">아니오</text>
    <rect x="804" y="174" width="312" height="84" rx="12" fill="#FFF1F4" stroke="#BE123C" stroke-width="1.5"/>
    <text class="fail-title" x="960" y="209" text-anchor="middle">사람의 인상</text>
    <text class="fail-body" x="960" y="240" text-anchor="middle">자료와 기준 시점부터 정하기</text>
  </g>

  <path class="flow" d="M372 264V336"/>
  <text class="branch" x="392" y="307" fill="#0F2C59">예</text>

  <g>
    <rect class="gate" x="84" y="336" width="576" height="96" rx="12"/>
    <text class="eyebrow" x="372" y="367" text-anchor="middle">GATE 2 · RULE</text>
    <text class="question" x="372" y="405" text-anchor="middle">조건을 계산식·임계값으로 쓸 수 있나?</text>
    <path class="fail-flow" d="M660 384H804"/>
    <text class="branch" x="732" y="369" text-anchor="middle" fill="#BE123C">아니오</text>
    <rect x="804" y="342" width="312" height="84" rx="12" fill="#FFF1F4" stroke="#BE123C" stroke-width="1.5"/>
    <text class="fail-title" x="960" y="377" text-anchor="middle">모호한 규칙</text>
    <text class="fail-body" x="960" y="408" text-anchor="middle">조건을 수치로 다시 쓰기</text>
  </g>

  <path class="flow" d="M372 432V504"/>
  <text class="branch" x="392" y="475" fill="#0F2C59">예</text>

  <g>
    <rect class="gate" x="84" y="504" width="576" height="96" rx="12"/>
    <text class="eyebrow" x="372" y="535" text-anchor="middle">GATE 3 · ACTION</text>
    <text class="question" x="372" y="573" text-anchor="middle">조건별 매수·매도·보유가 정해졌나?</text>
    <path class="fail-flow" d="M660 552H804"/>
    <text class="branch" x="732" y="537" text-anchor="middle" fill="#BE123C">아니오</text>
    <rect x="804" y="510" width="312" height="84" rx="12" fill="#FFF1F4" stroke="#BE123C" stroke-width="1.5"/>
    <text class="fail-title" x="960" y="545" text-anchor="middle">거래 행동이 없음</text>
    <text class="fail-body" x="960" y="576" text-anchor="middle">행동 규칙까지 정하기</text>
  </g>

  <path class="flow" d="M372 600V672"/>
  <text class="branch" x="392" y="643" fill="#0F2C59">예</text>

  <g>
    <rect class="gate" x="84" y="672" width="576" height="96" rx="12"/>
    <text class="eyebrow" x="372" y="703" text-anchor="middle">GATE 4 · REPLAY</text>
    <text class="question" x="372" y="741" text-anchor="middle">같은 규칙을 과거에 다시 적용할 수 있나?</text>
    <path class="fail-flow" d="M660 720H804"/>
    <text class="branch" x="732" y="705" text-anchor="middle" fill="#BE123C">아니오</text>
    <rect x="804" y="678" width="312" height="84" rx="12" fill="#FFF1F4" stroke="#BE123C" stroke-width="1.5"/>
    <text class="fail-title" x="960" y="713" text-anchor="middle">과거 검증 불가</text>
    <text class="fail-body" x="960" y="744" text-anchor="middle">당시 자료와 시점을 복원</text>
  </g>

  <path class="pass-flow" d="M372 768V840"/>
  <text class="branch" x="392" y="811" fill="#0B7A6A">예</text>
  <rect x="84" y="840" width="576" height="72" rx="36" fill="#E4F6F0" stroke="#0B7A6A" stroke-width="1.5"/>
  <text class="hero" x="372" y="887" text-anchor="middle">검증 가능한 퀀트 전략 후보</text>
</svg>
