<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title">
  <title id="title">현재 1강 정본에서 다시 계산한 화면과 내레이션 규모</title>
  <style>
    .bg{fill:#fafaf9}.doc{fill:#e8eef8;stroke:#0f2c59;stroke-width:2}.card{fill:#fff;stroke:#d7dce3;stroke-width:2}.accent{fill:#e4efe8;stroke:#2c6e4a;stroke-width:2}.h{font:800 29px Inter,"Noto Sans KR",sans-serif;fill:#0f2c59}.n{font:800 28px Inter,"Noto Sans KR",sans-serif;fill:#101114}.k{font:700 14px Inter,"Noto Sans KR",sans-serif;fill:#5a6472}.s{font:500 13px Inter,"Noto Sans KR",sans-serif;fill:#5a6472}.line{stroke:#0f2c59;stroke-width:2}
  </style>
  <rect class="bg" width="960" height="420"/>
  <rect class="doc" x="34" y="34" width="250" height="352" rx="14"/>
  <path d="M72 82h174M72 116h138M72 150h160" class="line"/>
  <text class="h" x="72" y="220">정본 재계산</text><text class="s" x="72" y="250">outline.md + script.md</text>
  <text class="n" x="72" y="313">47장</text><text class="k" x="72" y="340">슬라이드·문단</text>
  <g transform="translate(318 34)"><rect class="card" width="190" height="104" rx="12"/><text class="n" x="22" y="50">173개</text><text class="k" x="22" y="79">내레이션 문장</text></g>
  <g transform="translate(532 34)"><rect class="accent" width="190" height="104" rx="12"/><text class="n" x="22" y="50">133장</text><text class="k" x="22" y="79">영상용 화면 상태</text></g>
  <g transform="translate(746 34)"><rect class="card" width="180" height="104" rx="12"/><text class="n" x="22" y="50">12종</text><text class="k" x="22" y="79">레이아웃</text></g>
  <g transform="translate(318 158)"><rect class="accent" width="190" height="104" rx="12"/><text class="n" x="22" y="50">30장</text><text class="k" x="22" y="79">항목별 드러내기</text></g>
  <g transform="translate(532 158)"><rect class="card" width="190" height="104" rx="12"/><text class="n" x="22" y="50">4장</text><text class="k" x="22" y="79">한 번에 표시</text></g>
  <g transform="translate(746 158)"><rect class="card" width="180" height="104" rx="12"/><text class="n" x="22" y="50">175자</text><text class="k" x="22" y="79">가장 긴 문단</text></g>
  <rect class="card" x="318" y="286" width="608" height="100" rx="12"/>
  <text class="k" x="344" y="322">계산 원칙</text><text class="n" x="344" y="360">소스 구조를 파싱해 다시 잰 값</text><text class="s" x="344" y="382">이해도나 선호도 수치가 아니라 화면 구성 측정</text>
