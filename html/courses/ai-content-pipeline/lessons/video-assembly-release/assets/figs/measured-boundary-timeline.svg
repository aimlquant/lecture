  <g transform="translate(274 150)"><rect class="s2" width="258" height="104" rx="9"/><text class="h" x="20" y="42">상태 2</text><text class="v" x="20" y="76">5.00초</text></g>
  <g transform="translate(532 150)"><rect class="s3" width="335" height="104" rx="9"/><text class="h" x="20" y="42">상태 3</text><text class="v" x="20" y="76">6.45초</text></g>
