  <style>
    .bg{fill:#fafaf9}.box{fill:#fff;stroke:#d7dce3;stroke-width:2}.snap{fill:#e4efe8;stroke:#2c6e4a;stroke-width:2}.h{font:800 18px Inter,"Noto Sans KR",sans-serif;fill:#101114}.k{font:700 12px Inter,"Noto Sans KR",sans-serif;fill:#5a6472}.v{font:800 17px ui-monospace,monospace;fill:#0f2c59}.arrow{stroke:#0f2c59;stroke-width:2;fill:none;marker-end:url(#a)}
