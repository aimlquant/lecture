<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">주관적 차트 패턴을 명시적 규칙으로 바꾸기</title>
  <desc id="desc">왼쪽의 헤드 앤 숄더 모양을 오른쪽의 봉우리 구조, 높이 허용치, 시간 간격, 행동 조건으로 바꾼다.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto">
      <path d="M0 0L18 5L0 10Z" fill="context-stroke"/>
    </marker>
    <style>
      text { font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif; fill:#0F172A; }
      .title { font-size:34px; font-weight:700; }
      .body { font-size:26px; font-weight:400; fill:#52606D; }
      .row-title { font-size:26px; font-weight:700; }
      .row-body { font-size:23px; font-weight:400; fill:#52606D; }
      .label { font-size:23px; font-weight:700; fill:#52606D; paint-order:stroke fill; stroke:#FFFFFF; stroke-width:5px; stroke-linejoin:round; }
      .panel { fill:#FFFFFF; stroke:#C7D2E1; stroke-width:1.5; }
      .flow { fill:none; stroke:#0F2C59; stroke-width:3; stroke-linecap:round; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="610" fill="#FFFFFF"/>

  <rect class="panel" x="36" y="36" width="504" height="538" rx="12"/>
  <text class="title" x="288" y="89" text-anchor="middle">눈으로 보는 패턴</text>
  <text class="body" x="288" y="127" text-anchor="middle">“헤드 앤 숄더처럼 보인다”</text>

  <path d="M112 506H504M112 506V172" fill="none" stroke="#C7D2E1" stroke-width="1.5"/>
  <path d="M128 424H492" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="9 8"/>
  <text class="label" x="132" y="407">목선</text>

  <polyline points="128,468 168,432 216,304 264,420 326,202 388,418 436,310 476,424 500,466" fill="none" stroke="#0F2C59" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="216" cy="304" r="9" fill="#0F2C59"/>
  <circle cx="326" cy="202" r="9" fill="#0F2C59"/>
  <circle cx="436" cy="310" r="9" fill="#0F2C59"/>
  <circle cx="500" cy="466" r="9" fill="#BE123C"/>
  <text class="label" x="216" y="279" text-anchor="middle">왼쪽 어깨</text>
  <text class="label" x="326" y="177" text-anchor="middle">머리</text>
  <text class="label" x="436" y="285" text-anchor="middle">오른쪽 어깨</text>
  <path d="M474 486L494 471" fill="none" stroke="#BE123C" stroke-width="2"/>
  <text class="label" x="468" y="508" text-anchor="end" fill="#BE123C">이탈</text>

  <path class="flow" d="M540 305H660"/>
  <text class="label" x="600" y="285" text-anchor="middle" fill="#0F2C59">명시</text>

  <rect class="panel" x="660" y="36" width="504" height="538" rx="12"/>
  <text class="title" x="912" y="89" text-anchor="middle">컴퓨터가 읽는 조건</text>
  <text class="body" x="912" y="127" text-anchor="middle">모든 값을 정해야 같은 패턴을 찾는다</text>

  <g>
    <rect x="700" y="158" width="424" height="78" rx="12" fill="#E7EEF9"/>
    <circle cx="732" cy="197" r="18" fill="#0F2C59"/>
    <text x="732" y="205" text-anchor="middle" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">1</text>
    <text class="row-title" x="764" y="189">봉우리 구조</text>
    <text class="row-body" x="764" y="220">봉우리 3개 · 머리가 가장 높음</text>
  </g>
  <g>
    <rect x="700" y="250" width="424" height="78" rx="12" fill="#E7EEF9"/>
    <circle cx="732" cy="289" r="18" fill="#0F2C59"/>
    <text x="732" y="297" text-anchor="middle" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">2</text>
    <text class="row-title" x="764" y="281">높이 허용치</text>
    <text class="row-body" x="764" y="312">양쪽 어깨 높이 차이 ≤ ε</text>
  </g>
  <g>
    <rect x="700" y="342" width="424" height="78" rx="12" fill="#E7EEF9"/>
    <circle cx="732" cy="381" r="18" fill="#0F2C59"/>
    <text x="732" y="389" text-anchor="middle" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">3</text>
    <text class="row-title" x="764" y="373">시간 간격</text>
    <text class="row-body" x="764" y="404">봉우리 사이 최소 N개 관측값</text>
  </g>
  <g>
    <rect x="700" y="434" width="424" height="78" rx="12" fill="#E4F6F0"/>
    <circle cx="732" cy="473" r="18" fill="#0B7A6A"/>
    <text x="732" y="481" text-anchor="middle" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">4</text>
    <text class="row-title" x="764" y="465">행동 조건</text>
    <text class="row-body" x="764" y="496">종가가 목선을 k만큼 이탈하면 판단</text>
  </g>
</svg>
