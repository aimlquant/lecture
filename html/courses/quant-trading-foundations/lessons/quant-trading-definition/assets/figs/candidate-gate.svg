<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">투자 아이디어가 퀀트 전략 후보가 되는 판별 관문</title>
  <desc id="desc">아이디어가 입력, 계산 가능한 조건, 행동, 과거 재실행 네 관문을 모두 통과해야 검사 가능한 전략 후보가 되는 결정 트리</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5z" fill="#0F2C59"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5z" fill="#BE123C"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5z" fill="#0B7A6A"/>
    </marker>
    <style>
      text { font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; fill:#0F172A; }
      .step { font-size:18px; font-weight:850; letter-spacing:1px; fill:#52606D; }
      .question { font-size:25px; font-weight:900; }
      .branch { font-size:18px; font-weight:900; }
      .fail { font-size:20px; font-weight:850; fill:#9F1239; }
      .pass { font-size:27px; font-weight:900; fill:#0B6B5D; }
      .sub { font-size:19px; font-weight:650; fill:#475569; }
    </style>
  </defs>
  <rect width="1200" height="860" rx="28" fill="#F8FAFC"/>

  <rect x="390" y="35" width="420" height="82" rx="41" fill="#E7EEF9" stroke="#6D88AE" stroke-width="3"/>
  <text x="600" y="69" text-anchor="middle" class="step">START</text>
  <text x="600" y="98" text-anchor="middle" class="question">투자 아이디어 한 문장</text>

  <path d="M600 117V165" stroke="#0F2C59" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="360" y="165" width="480" height="95" rx="18" fill="#FFFFFF" stroke="#7894BC" stroke-width="3"/>
  <text x="600" y="198" text-anchor="middle" class="step">GATE 1 · INPUT</text>
  <text x="600" y="235" text-anchor="middle" class="question">입력 자료와 시점을 적을 수 있나?</text>
  <path d="M840 213H925" stroke="#BE123C" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-red)"/>
  <text x="875" y="199" text-anchor="middle" class="branch" fill="#BE123C">아니오</text>
  <rect x="925" y="172" width="240" height="82" rx="16" fill="#FFF1F4" stroke="#D4778E" stroke-width="3"/>
  <text x="1045" y="205" text-anchor="middle" class="fail">사람의 인상</text>
  <text x="1045" y="235" text-anchor="middle" class="sub">데이터부터 정의</text>

  <path d="M600 260V315" stroke="#0F2C59" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="626" y="288" class="branch" fill="#0B7A6A">예</text>
  <rect x="360" y="315" width="480" height="95" rx="18" fill="#FFFFFF" stroke="#7894BC" stroke-width="3"/>
  <text x="600" y="348" text-anchor="middle" class="step">GATE 2 · RULE</text>
  <text x="600" y="385" text-anchor="middle" class="question">조건을 계산식과 임계값으로 쓸 수 있나?</text>
  <path d="M840 363H925" stroke="#BE123C" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-red)"/>
  <text x="875" y="349" text-anchor="middle" class="branch" fill="#BE123C">아니오</text>
  <rect x="925" y="322" width="240" height="82" rx="16" fill="#FFF1F4" stroke="#D4778E" stroke-width="3"/>
  <text x="1045" y="355" text-anchor="middle" class="fail">모호한 규칙</text>
  <text x="1045" y="385" text-anchor="middle" class="sub">빈 단어를 수치화</text>

  <path d="M600 410V465" stroke="#0F2C59" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="626" y="438" class="branch" fill="#0B7A6A">예</text>
  <rect x="360" y="465" width="480" height="95" rx="18" fill="#FFFFFF" stroke="#7894BC" stroke-width="3"/>
  <text x="600" y="498" text-anchor="middle" class="step">GATE 3 · ACTION</text>
  <text x="600" y="535" text-anchor="middle" class="question">조건별 매수·매도·보유가 정해졌나?</text>
  <path d="M840 513H925" stroke="#BE123C" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-red)"/>
  <text x="875" y="499" text-anchor="middle" class="branch" fill="#BE123C">아니오</text>
  <rect x="925" y="472" width="240" height="82" rx="16" fill="#FFF1F4" stroke="#D4778E" stroke-width="3"/>
  <text x="1045" y="505" text-anchor="middle" class="fail">분석에서 멈춤</text>
  <text x="1045" y="535" text-anchor="middle" class="sub">행동 규칙을 연결</text>

  <path d="M600 560V615" stroke="#0F2C59" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="626" y="588" class="branch" fill="#0B7A6A">예</text>
  <rect x="360" y="615" width="480" height="95" rx="18" fill="#FFFFFF" stroke="#7894BC" stroke-width="3"/>
  <text x="600" y="648" text-anchor="middle" class="step">GATE 4 · REPLAY</text>
  <text x="600" y="685" text-anchor="middle" class="question">과거 시점의 데이터로 다시 실행할 수 있나?</text>
  <path d="M840 663H925" stroke="#BE123C" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-red)"/>
  <text x="875" y="649" text-anchor="middle" class="branch" fill="#BE123C">아니오</text>
  <rect x="925" y="622" width="240" height="82" rx="16" fill="#FFF1F4" stroke="#D4778E" stroke-width="3"/>
  <text x="1045" y="655" text-anchor="middle" class="fail">검사 불가능</text>
  <text x="1045" y="685" text-anchor="middle" class="sub">시점·기록을 복원</text>

  <path d="M600 710V763" stroke="#0B7A6A" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <text x="626" y="739" class="branch" fill="#0B7A6A">예</text>
  <rect x="330" y="763" width="540" height="72" rx="36" fill="#DDF5EE" stroke="#0B7A6A" stroke-width="4"/>
  <text x="600" y="806" text-anchor="middle" class="pass">검사 가능한 퀀트 전략 후보</text>
</svg>
