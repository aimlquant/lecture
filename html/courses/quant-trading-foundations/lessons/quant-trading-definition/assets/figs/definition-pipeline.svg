<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">퀀트 트레이딩의 네 단계</title>
  <desc id="desc">입력 자료, 명시적 규칙, 거래 판단, 과거 재실행이 차례로 이어지고 재실행 결과가 다시 입력과 규칙 설계로 돌아간다.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto">
      <path d="M0 0L18 5L0 10Z" fill="context-stroke"/>
    </marker>
    <style>
      text { font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif; fill:#0F172A; }
      .eyebrow { font-size:20px; font-weight:700; letter-spacing:1.2px; fill:#52606D; }
      .title { font-size:34px; font-weight:700; }
      .body { font-size:26px; font-weight:400; fill:#52606D; }
      .body-small { font-size:24px; font-weight:400; fill:#52606D; }
      .card { fill:#FFFFFF; stroke:#C7D2E1; stroke-width:1.5; }
      .flow { fill:none; stroke:#0F2C59; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .loop { fill:none; stroke:#B45309; stroke-width:2; stroke-dasharray:9 8; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="360" fill="#FFFFFF"/>

  <g>
    <rect class="card" x="20" y="54" width="236" height="220" rx="12"/>
    <rect x="20" y="54" width="236" height="8" rx="4" fill="#0F2C59"/>
    <text class="eyebrow" x="44" y="99">01 · INPUT</text>
    <text class="title" x="44" y="145">입력 자료</text>
    <text class="body" x="44" y="190">가격 · 재무 · 뉴스</text>
    <text class="body" x="44" y="228">시점이 붙은 데이터</text>
  </g>

  <path class="flow" d="M256 164H328"/>

  <g>
    <rect class="card" x="328" y="54" width="236" height="220" rx="12"/>
    <rect x="328" y="54" width="236" height="8" rx="4" fill="#0F2C59"/>
    <text class="eyebrow" x="352" y="99">02 · RULE</text>
    <text class="title" x="352" y="145">명시적 규칙</text>
    <text class="body" x="352" y="190">계산 · 순서 · 임계값</text>
    <text class="body" x="352" y="228">해석할 빈칸 없음</text>
  </g>

  <path class="flow" d="M564 164H636"/>

  <g>
    <rect class="card" x="636" y="54" width="236" height="220" rx="12"/>
    <rect x="636" y="54" width="236" height="8" rx="4" fill="#0F2C59"/>
    <text class="eyebrow" x="660" y="99">03 · DECISION</text>
    <text class="title" x="660" y="145">거래 판단</text>
    <text class="body" x="660" y="190">매수 · 매도 · 보유</text>
    <text class="body" x="660" y="228">행동까지 출력</text>
  </g>

  <path class="flow" d="M872 164H944"/>

  <g>
    <rect class="card" x="944" y="54" width="236" height="220" rx="12"/>
    <rect x="944" y="54" width="236" height="8" rx="4" fill="#B45309"/>
    <text class="eyebrow" x="968" y="99">04 · REPLAY</text>
    <text class="title" x="968" y="145">과거 재실행</text>
    <text class="body-small" x="968" y="184">같은 입력</text>
    <text class="body-small" x="968" y="217">같은 판단</text>
    <text class="body-small" x="968" y="250">성과는 별도 검증</text>
  </g>

  <path class="loop" d="M1062 274V326H138V274"/>
</svg>
