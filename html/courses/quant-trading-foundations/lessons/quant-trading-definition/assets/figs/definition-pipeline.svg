<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">퀀트 트레이딩을 이루는 네 단계</title>
  <desc id="desc">입력 데이터가 명시적 규칙을 지나 매수 매도 보유 결정이 되고 과거 데이터로 다시 실행되는 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5z" fill="#0F2C59"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5z" fill="#B45309"/>
    </marker>
    <style>
      text { font-family: 'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; fill:#0F172A; }
      .step { font-size:20px; font-weight:800; letter-spacing:1.5px; fill:#52606D; }
      .main { font-size:31px; font-weight:900; }
      .detail { font-size:22px; font-weight:600; fill:#475569; }
      .chip { font-size:20px; font-weight:800; fill:#0F2C59; }
    </style>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#F8FAFC"/>

  <rect x="365" y="52" width="470" height="54" rx="27" fill="#E7EEF9" stroke="#B8C8E2" stroke-width="2"/>
  <text x="600" y="86" text-anchor="middle" class="chip">사람이 설계하고 · 컴퓨터가 같은 절차를 반복한다</text>

  <g>
    <rect x="30" y="165" width="255" height="250" rx="18" fill="#FFFFFF" stroke="#A8BAD5" stroke-width="3"/>
    <rect x="30" y="165" width="255" height="14" rx="7" fill="#2563EB"/>
    <text x="158" y="218" text-anchor="middle" class="step">01 · INPUT</text>
    <text x="158" y="270" text-anchor="middle" class="main">입력 데이터</text>
    <text x="158" y="320" text-anchor="middle" class="detail">가격 · 재무 · 뉴스</text>
    <text x="158" y="358" text-anchor="middle" class="detail">시점이 붙은 값</text>
  </g>

  <path d="M285 290H330" fill="none" stroke="#0F2C59" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g>
    <rect x="330" y="165" width="255" height="250" rx="18" fill="#FFFFFF" stroke="#A8BAD5" stroke-width="3"/>
    <rect x="330" y="165" width="255" height="14" rx="7" fill="#0F2C59"/>
    <text x="458" y="218" text-anchor="middle" class="step">02 · RULE</text>
    <text x="458" y="270" text-anchor="middle" class="main">명시적 규칙</text>
    <text x="458" y="320" text-anchor="middle" class="detail">계산 · 순서 · 임계값</text>
    <text x="458" y="358" text-anchor="middle" class="detail">해석할 빈칸 없음</text>
  </g>

  <path d="M585 290H630" fill="none" stroke="#0F2C59" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g>
    <rect x="630" y="165" width="255" height="250" rx="18" fill="#FFFFFF" stroke="#A8BAD5" stroke-width="3"/>
    <rect x="630" y="165" width="255" height="14" rx="7" fill="#0B7A6A"/>
    <text x="758" y="218" text-anchor="middle" class="step">03 · DECISION</text>
    <text x="758" y="270" text-anchor="middle" class="main">거래 판단</text>
    <text x="758" y="320" text-anchor="middle" class="detail">매수 · 매도 · 보유</text>
    <text x="758" y="358" text-anchor="middle" class="detail">행동까지 출력</text>
  </g>

  <path d="M885 290H930" fill="none" stroke="#0F2C59" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g>
    <rect x="930" y="165" width="240" height="250" rx="18" fill="#FFFFFF" stroke="#A8BAD5" stroke-width="3"/>
    <rect x="930" y="165" width="240" height="14" rx="7" fill="#B45309"/>
    <text x="1050" y="218" text-anchor="middle" class="step">04 · REPLAY</text>
    <text x="1050" y="270" text-anchor="middle" class="main">과거 재실행</text>
    <text x="1050" y="320" text-anchor="middle" class="detail">같은 입력 → 같은 판단</text>
    <text x="1050" y="358" text-anchor="middle" class="detail">수익성은 별도 검증</text>
  </g>

  <path d="M1050 415V482H158V415" fill="none" stroke="#B45309" stroke-width="4" stroke-dasharray="11 10" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <text x="600" y="523" text-anchor="middle" class="chip" fill="#B45309">새 기간·새 데이터에서도 같은 정의를 다시 적용</text>
</svg>
