<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">정보에서 검증 기록까지 이어지는 다섯 칸 사슬</title>
  <desc id="desc">정보, 입력, 규칙, 행동, 검증 기록의 다섯 상자가 같은 크기로 왼쪽에서 오른쪽으로 연결된다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f2c59"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", NanumGothic, Inter, system-ui, sans-serif; fill: #101114; }
      .box { fill: #ffffff; stroke: #b8c2d2; stroke-width: 2; rx: 8; }
      .step { font-size: 16px; font-weight: 800; letter-spacing: .08em; fill: #0f2c59; }
      .name { font-size: 28px; font-weight: 800; }
      .detail { font-size: 18px; font-weight: 600; fill: #5c6470; }
      .arrow { fill: none; stroke: #0f2c59; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="600" fill="#fafaf9"/>

  <path class="arrow" d="M255 300 H285"/>
  <path class="arrow" d="M475 300 H505"/>
  <path class="arrow" d="M695 300 H725"/>
  <path class="arrow" d="M915 300 H945"/>

  <g transform="translate(65 190)">
    <rect class="box" width="190" height="220"/>
    <text class="step" x="24" y="38">01</text>
    <text class="name" x="95" y="91" text-anchor="middle">정보</text>
    <text class="detail" x="95" y="137" text-anchor="middle">가격 · 재무</text>
    <text class="detail" x="95" y="166" text-anchor="middle">뉴스</text>
  </g>
  <g transform="translate(285 190)">
    <rect class="box" width="190" height="220"/>
    <text class="step" x="24" y="38">02</text>
    <text class="name" x="95" y="91" text-anchor="middle">입력</text>
    <text class="detail" x="95" y="137" text-anchor="middle">값 · 단위</text>
    <text class="detail" x="95" y="166" text-anchor="middle">알려진 시각</text>
  </g>
  <g transform="translate(505 190)">
    <rect class="box" width="190" height="220"/>
    <text class="step" x="24" y="38">03</text>
    <text class="name" x="95" y="91" text-anchor="middle">규칙</text>
    <text class="detail" x="95" y="137" text-anchor="middle">계산식 · 문턱</text>
    <text class="detail" x="95" y="166" text-anchor="middle">모델 버전</text>
  </g>
  <g transform="translate(725 190)">
    <rect class="box" width="190" height="220"/>
    <text class="step" x="24" y="38">04</text>
    <text class="name" x="95" y="91" text-anchor="middle">행동</text>
    <text class="detail" x="95" y="137" text-anchor="middle">신호 · 체결</text>
    <text class="detail" x="95" y="166" text-anchor="middle">청산 · 비용</text>
  </g>
  <g transform="translate(945 190)">
    <rect class="box" width="190" height="220"/>
    <text class="step" x="24" y="38">05</text>
    <text class="name" x="95" y="91" text-anchor="middle">검증 기록</text>
    <text class="detail" x="95" y="137" text-anchor="middle">거래별 감사표</text>
    <text class="detail" x="95" y="166" text-anchor="middle">반증 결과</text>
  </g>
</svg>
