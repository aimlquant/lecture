<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">재량 판독과 명시적 규칙의 반복 가능성 비교</title>
  <desc id="desc">같은 차트를 두 사람이 다르게 판단하는 왼쪽 흐름과 같은 입력을 같은 규칙이 같은 결정으로 만드는 오른쪽 흐름</desc>
  <defs>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5z" fill="#7F1D3F"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5z" fill="#0B6B5D"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5z" fill="#0F2C59"/>
    </marker>
    <style>
      text { font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; fill:#0F172A; }
      .head { font-size:30px; font-weight:900; }
      .small { font-size:19px; font-weight:750; fill:#52606D; }
      .label { font-size:23px; font-weight:850; }
      .result { font-size:25px; font-weight:900; }
    </style>
  </defs>
  <rect width="1200" height="640" rx="28" fill="#F8FAFC"/>

  <rect x="35" y="35" width="545" height="570" rx="24" fill="#FFF7F7" stroke="#F0B8C7" stroke-width="3"/>
  <text x="308" y="88" text-anchor="middle" class="head" fill="#9F1239">사람의 재량 판독</text>
  <text x="308" y="122" text-anchor="middle" class="small">같은 차트 · 해석 기준은 머릿속</text>

  <rect x="185" y="160" width="245" height="92" rx="16" fill="#FFFFFF" stroke="#D7A6B4" stroke-width="3"/>
  <text x="308" y="196" text-anchor="middle" class="small">동일한 가격 차트</text>
  <polyline points="215,228 250,215 282,224 318,184 354,222 390,208" fill="none" stroke="#BE123C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M250 252V300H155V346" fill="none" stroke="#7F1D3F" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-red)"/>
  <path d="M366 252V300H460V346" fill="none" stroke="#7F1D3F" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-red)"/>

  <rect x="70" y="346" width="170" height="82" rx="14" fill="#FFFFFF" stroke="#D7A6B4" stroke-width="3"/>
  <text x="155" y="380" text-anchor="middle" class="label">분석자 A</text>
  <text x="155" y="408" text-anchor="middle" class="small">“상승 전환”</text>
  <rect x="375" y="346" width="170" height="82" rx="14" fill="#FFFFFF" stroke="#D7A6B4" stroke-width="3"/>
  <text x="460" y="380" text-anchor="middle" class="label">분석자 B</text>
  <text x="460" y="408" text-anchor="middle" class="small">“하락 지속”</text>

  <rect x="130" y="486" width="355" height="72" rx="36" fill="#FFE4EC" stroke="#BE123C" stroke-width="3"/>
  <text x="308" y="531" text-anchor="middle" class="result" fill="#9F1239">판단이 사람에 따라 달라짐</text>

  <rect x="620" y="35" width="545" height="570" rx="24" fill="#F2FBF8" stroke="#A8DACD" stroke-width="3"/>
  <text x="893" y="88" text-anchor="middle" class="head" fill="#0B6B5D">명시적 퀀트 규칙</text>
  <text x="893" y="122" text-anchor="middle" class="small">같은 입력 · 계산 기준은 규칙 안</text>

  <rect x="700" y="160" width="180" height="92" rx="16" fill="#FFFFFF" stroke="#9ACABD" stroke-width="3"/>
  <text x="790" y="196" text-anchor="middle" class="small">동일한 입력</text>
  <text x="790" y="226" text-anchor="middle" class="label">가격 배열 X</text>
  <path d="M880 206H930" fill="none" stroke="#0F2C59" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
  <rect x="930" y="160" width="175" height="92" rx="16" fill="#E7EEF9" stroke="#7894BC" stroke-width="3"/>
  <text x="1018" y="196" text-anchor="middle" class="small">고정된 규칙</text>
  <text x="1018" y="226" text-anchor="middle" class="label">f(X)</text>

  <path d="M790 252V300H758V346" fill="none" stroke="#0B6B5D" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <path d="M1018 252V300H1028V346" fill="none" stroke="#0B6B5D" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <rect x="680" y="346" width="155" height="82" rx="14" fill="#FFFFFF" stroke="#9ACABD" stroke-width="3"/>
  <text x="758" y="380" text-anchor="middle" class="label">실행 1</text>
  <text x="758" y="408" text-anchor="middle" class="small">매수</text>
  <rect x="950" y="346" width="155" height="82" rx="14" fill="#FFFFFF" stroke="#9ACABD" stroke-width="3"/>
  <text x="1028" y="380" text-anchor="middle" class="label">실행 2</text>
  <text x="1028" y="408" text-anchor="middle" class="small">매수</text>

  <rect x="715" y="486" width="355" height="72" rx="36" fill="#DDF5EE" stroke="#0B7A6A" stroke-width="3"/>
  <text x="893" y="531" text-anchor="middle" class="result" fill="#0B6B5D">같은 입력이면 같은 판단</text>
</svg>
