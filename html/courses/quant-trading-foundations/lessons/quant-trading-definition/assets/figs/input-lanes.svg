<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">가격, 재무, 뉴스가 같은 신호 표로 합쳐지는 세 입력 경로</title>
  <desc id="desc">세 종류의 정보가 각각 변환 규칙과 알려진 시각을 거쳐 공통 신호 표의 서로 다른 행으로 들어간다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f2c59"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", NanumGothic, Inter, system-ui, sans-serif; fill: #101114; }
      .source { fill: #ffffff; stroke: #b8c2d2; stroke-width: 2; rx: 8; }
      .transform { fill: #e8eef8; stroke: #7890b5; stroke-width: 2; rx: 8; }
      .ledger { fill: #ffffff; stroke: #0f2c59; stroke-width: 3; rx: 10; }
      .name { font-size: 25px; font-weight: 800; }
      .detail { font-size: 17px; font-weight: 600; fill: #5c6470; }
      .label { font-size: 14px; font-weight: 800; letter-spacing: .08em; fill: #0f2c59; }
      .row { font-size: 18px; font-weight: 700; }
      .arrow { fill: none; stroke: #0f2c59; stroke-width: 4; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="600" fill="#fafaf9"/>

  <path class="arrow" d="M280 155 H380"/>
  <path class="arrow" d="M630 155 H720 V240 H820"/>
  <path class="arrow" d="M280 305 H380"/>
  <path class="arrow" d="M630 305 H820"/>
  <path class="arrow" d="M280 455 H380"/>
  <path class="arrow" d="M630 455 H720 V370 H820"/>

  <g transform="translate(60 100)">
    <rect class="source" width="220" height="110"/>
    <text class="name" x="110" y="49" text-anchor="middle">가격 · 거래량</text>
    <text class="detail" x="110" y="80" text-anchor="middle">시계열 숫자</text>
  </g>
  <g transform="translate(60 250)">
    <rect class="source" width="220" height="110"/>
    <text class="name" x="110" y="49" text-anchor="middle">재무 정보</text>
    <text class="detail" x="110" y="80" text-anchor="middle">공시 표</text>
  </g>
  <g transform="translate(60 400)">
    <rect class="source" width="220" height="110"/>
    <text class="name" x="110" y="49" text-anchor="middle">뉴스</text>
    <text class="detail" x="110" y="80" text-anchor="middle">기사 문장</text>
  </g>

  <g transform="translate(380 100)">
    <rect class="transform" width="250" height="110"/>
    <text class="label" x="24" y="32">변환 규칙</text>
    <text class="name" x="125" y="67" text-anchor="middle">수익률 · 평균 · 순위</text>
    <text class="detail" x="125" y="94" text-anchor="middle">거래소 시각</text>
  </g>
  <g transform="translate(380 250)">
    <rect class="transform" width="250" height="110"/>
    <text class="label" x="24" y="32">변환 규칙</text>
    <text class="name" x="125" y="67" text-anchor="middle">비율 · 성장률</text>
    <text class="detail" x="125" y="94" text-anchor="middle">공시 · 정정 시각</text>
  </g>
  <g transform="translate(380 400)">
    <rect class="transform" width="250" height="110"/>
    <text class="label" x="24" y="32">변환 규칙</text>
    <text class="name" x="125" y="67" text-anchor="middle">분류 · 점수</text>
    <text class="detail" x="125" y="94" text-anchor="middle">모델 버전 · 게시 시각</text>
  </g>

  <g transform="translate(820 185)">
    <rect class="ledger" width="320" height="240"/>
    <text class="label" x="28" y="38">공통 출력</text>
    <text class="name" x="160" y="78" text-anchor="middle">신호 감사표</text>
    <line x1="28" y1="101" x2="292" y2="101" stroke="#dfe2e7" stroke-width="2"/>
    <text class="row" x="40" y="137">값</text>
    <text class="row" x="40" y="172">알려진 시각</text>
    <text class="row" x="40" y="207">신호 · 행동 · 비용</text>
  </g>
</svg>
