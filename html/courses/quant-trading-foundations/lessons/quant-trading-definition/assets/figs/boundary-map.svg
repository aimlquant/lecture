<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">기술적 분석과 퀀트 트레이딩의 경계 지도</title>
  <desc id="desc">주관적 차트 판단, 코드로 표현한 기술 규칙, 차트 밖 정량 입력의 세 구역이 같은 크기로 나란히 놓인다.</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", NanumGothic, Inter, system-ui, sans-serif; fill: #101114; }
      .zone { stroke-width: 2; rx: 10; }
      .left { fill: #f3f4f6; stroke: #c9ced6; }
      .middle { fill: #e8eef8; stroke: #7890b5; }
      .right { fill: #ffffff; stroke: #b8c2d2; }
      .tag { font-size: 15px; font-weight: 800; letter-spacing: .08em; fill: #0f2c59; }
      .name { font-size: 26px; font-weight: 800; }
      .detail { font-size: 18px; font-weight: 600; fill: #5c6470; }
      .question { font-size: 24px; font-weight: 800; fill: #ffffff; }
      .hint { font-size: 17px; font-weight: 600; fill: #dbe5f5; }
    </style>
  </defs>
  <rect width="1200" height="600" fill="#fafaf9"/>

  <g transform="translate(70 130)">
    <rect class="zone left" width="330" height="270"/>
    <text class="tag" x="28" y="42">기술적 분석</text>
    <text class="name" x="165" y="98" text-anchor="middle">주관적 차트 판단</text>
    <text class="detail" x="165" y="150" text-anchor="middle">“강해 보인다”</text>
    <text class="detail" x="165" y="184" text-anchor="middle">패턴 허용 오차 없음</text>
    <text class="detail" x="165" y="218" text-anchor="middle">사람마다 다른 행동</text>
  </g>
  <g transform="translate(435 130)">
    <rect class="zone middle" width="330" height="270"/>
    <text class="tag" x="28" y="42">겹치는 영역</text>
    <text class="name" x="165" y="98" text-anchor="middle">코드로 표현한 기술 규칙</text>
    <text class="detail" x="165" y="150" text-anchor="middle">정확한 가격 열</text>
    <text class="detail" x="165" y="184" text-anchor="middle">기간 · 문턱 · 시각</text>
    <text class="detail" x="165" y="218" text-anchor="middle">같은 입력, 같은 신호</text>
  </g>
  <g transform="translate(800 130)">
    <rect class="zone right" width="330" height="270"/>
    <text class="tag" x="28" y="42">퀀트 트레이딩</text>
    <text class="name" x="165" y="98" text-anchor="middle">차트 밖 정량 입력</text>
    <text class="detail" x="165" y="150" text-anchor="middle">매출 · 현금흐름</text>
    <text class="detail" x="165" y="184" text-anchor="middle">부채비율 · 뉴스 점수</text>
    <text class="detail" x="165" y="218" text-anchor="middle">공개 시각과 변환 규칙</text>
  </g>

  <rect x="70" y="445" width="1060" height="100" rx="10" fill="#0f2c59"/>
  <text class="question" x="600" y="488" text-anchor="middle">경계 질문: 같은 시점의 같은 입력에서 같은 행동이 나오는가?</text>
  <text class="hint" x="600" y="521" text-anchor="middle">정보의 종류가 아니라 재현 가능한 표현 여부를 본다</text>
</svg>
