<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" role="img" aria-labelledby="title desc"><title id="title">질문에 따라 공식 자료를 찾는 곳이 달라진다</title><desc id="desc">세 질문을 주가·재무제표·금리로 나누고 KRX, DART, ECOS로 연결한 학습용 분류도.</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="18" refY="5" markerWidth="18" markerHeight="10" orient="auto"><path d="M0 0L18 5L0 10Z" fill="#0F2C59"/></marker></defs><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#0F172A;font-size:25px}.big{font-size:32px;font-weight:700}.small{font-size:23px;fill:#52606D}.teal{fill:#0B7A6A}.amber{fill:#B45309}.line{stroke:#0F2C59;stroke-width:3;fill:none;marker-end:url(#arrow)}.icon{fill:none;stroke:#0B7A6A;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="594" fill="#FFFFFF"/><g id="price"><rect x="25" y="30" width="460" height="158" rx="12" fill="#E7EEF9"/><rect x="600" y="30" width="575" height="158" rx="12" fill="#FFFFFF" stroke="#C7D2E1" stroke-width="2"/><text x="55" y="88" class="big">얼마에 거래됐을까?</text><text x="55" y="141" class="small">주가 · 거래량</text><path class="line" d="M485 109H600"/><text x="640" y="89" class="big teal">KRX</text><text x="795" y="89">한국거래소</text><text x="640" y="141" class="small">일별 시세 · 종목코드</text></g><g id="financial"><rect x="25" y="218" width="460" height="158" rx="12" fill="#E7EEF9"/><rect x="600" y="218" width="575" height="158" rx="12" fill="#FFFFFF" stroke="#C7D2E1" stroke-width="2"/><text x="55" y="276" class="big">기업이 얼마를 벌었을까?</text><text x="55" y="329" class="small">재무제표</text><path class="line" d="M485 297H600"/><text x="640" y="277" class="big teal">DART</text><text x="795" y="277">금융감독원 전자공시</text><text x="640" y="329" class="small">기업 제출 자료 · 보고서</text></g><g id="rates"><rect x="25" y="406" width="460" height="158" rx="12" fill="#E7EEF9"/><rect x="600" y="406" width="575" height="158" rx="12" fill="#FFFFFF" stroke="#C7D2E1" stroke-width="2"/><text x="55" y="464" 