<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc"><title id="title">조회와 저장본 재실행은 다른 경로로 같은 표 검사를 수행한다</title><desc id="desc">새 수집과 저장본 확인을 두 갈래로 구분하고 기간·행·열·빈 값·출처 점검으로 합류한다.</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="18" refY="5" markerWidth="18" markerHeight="10" orient="auto"><path d="M0 0L18 5L0 10Z" fill="#0F2C59"/></marker></defs><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#0F172A;font-size:25px}.big{font-size:32px;font-weight:700}.small{font-size:23px;fill:#52606D}.teal{fill:#0B7A6A}.amber{fill:#B45309}.line{stroke:#0F2C59;stroke-width:3;fill:none;marker-end:url(#arrow)}.icon{fill:none;stroke:#0B7A6A;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="490" fill="#FFFFFF"/><g id="live"><rect x="35" y="30" width="500" height="180" rx="12" fill="#E4F6F0"/><text x="285" y="82" class="big" text-anchor="middle">조회 모드</text><text x="285" y="130" text-anchor="middle">네트워크에서 새로 받기</text><text x="285" y="175" class="small" text-anchor="middle">새 수집 시각 · 새 실행 폴더</text></g><g id="replay"><rect x="665" y="30" width="500" height="180" rx="12" fill="#E7EEF9"/><text x="915" y="82" class="big" text-anchor="middle">저장본 모드</text><text x="915" y="130" text-anchor="middle">기존 파일의 해시 확인</text><text x="915" y="175" class="small" text-anchor="middle">이전 수집 시각 · 네트워크 호출 없음</text></g><g id="join"><path class="line" d="M285 210V255H500V310"/><path class="line" d="M915 210V255H700V310"/></g><g id="checks"><rect x="235" y="310" width="730" height="150" rx="12" fill="#FFFFFF" stroke="#0F2C59" stroke-width="2"/><text x="600" y="370" class="big" text-anchor="middle">같은 기준으로 표를 확인</text><text x="600" y="420" text-anchor="middle">기간 · 행과 열 · 빈 값 · 출처 기록</text></g></svg>