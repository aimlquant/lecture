<script>
(function() {
  "use strict";
  var slideId = "s21";
  var times = [3.73,7.85,12.91,19.4];

    var current = clamp(step);
    var timeline = window.__timelines && window.__timelines["slide-" + slideId];
    if (!timeline) return false;

    document.documentElement.setAttribute("data-presentation-step", String(current));
    document.documentElement.setAttribute("data-presentation-ready", "true");

  }

})();
