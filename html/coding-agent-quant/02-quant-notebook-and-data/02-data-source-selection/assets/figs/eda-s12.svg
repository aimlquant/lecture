<svg style="font-family: Noto Sans CJK KR, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1728 670" class="teaching-board" role="img" aria-label="문제가 있는 행도 함께 보여 달라고 한다"><title>문제가 있는 행도 함께 보여 달라고 한다</title><rect x="60" y="35" width="1608" height="535" rx="22" fill="#fff" stroke="#c5d3da" stroke-width="3"/><text x="102" y="112" font-size="40" fill="#102e57" text-anchor="start" font-weight="700">에이전트에게 이렇게 요청합니다</text><g data-beat="2" data-arrival="rise"><text x="108" y="205" font-size="37" fill="#086c70" text-anchor="start" font-weight="700">세 가지 점검</text><text x="425" y="205" font-size="39" fill="#102e57" text-anchor="start" font-weight="400">빈값 · 중복 날짜 · 날짜 오름차순</text></g><g data-ink="2" data-underline-text="빈값 · 중복 날짜 · 날짜 오름차순" data-underline-size="39" data-underline-width="526.66"><path d="M425,223 H951.66" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><g data-beat="3" data-arrival="rise"><text x="108" y="313" font-size="37" fill="#086c70" text-anchor="start" font-weight="700">문제가 있으면</text><text x="425" y="313" font-size="39" fill="#102e57" text-anchor="start" font-weight="400">해당 행을 함께 보여 주세요</text></g><g data-ink="3" data-underline-text="해당 행을 함께 보여 주세요" data-underline-size="39" data-underline-width="429.56"><path d="M425,331 H854.56" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><g data-beat="4" data-arrival="rise"><text x="108" y="421" font-size="37" fill="#086c70" text-anchor="start" font-weight="700">원본 보존</text><text x="425" y="421" font-size="39" fill="#102e57" text-anchor="start" font-weight="400">이유를 확인하기 전에는 바꾸지 마세요</text></g><g data-ink="4" data-underline-text="이유를 확인하기 전에는 바꾸지 마세요" data-underline-size="39" data-underline-width="608.94"><path d="M425,439 H1033.94" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>