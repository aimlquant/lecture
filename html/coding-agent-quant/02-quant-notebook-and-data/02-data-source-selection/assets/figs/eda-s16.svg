<svg style="font-family: Noto Sans CJK KR, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1728 670" class="teaching-board" role="img" aria-label="문제를 확인한 다음 분석용 복사본을 만든다"><title>문제를 확인한 다음 분석용 복사본을 만든다</title><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 385" role="img" aria-labelledby="title desc" style="font-family:Noto Sans CJK KR,sans-serif" x="54" y="40" width="1620" height="540"><title id="title">기본 점검 결과에 따라 다음 행동을 고른다</title><desc id="desc">문제가 없으면 분석용 복사본으로 진행하고 있으면 행과 이유를 확인한다.</desc><rect width="1200" height="385" fill="#FFFFFF" /><rect x="45" y="92" width="275" height="205" rx="12" fill="#E7EEF9" stroke="#C7D2E1" stroke-width="2" /><text x="182" y="155" fill="#0F2C59" font-size="29" font-weight="700" text-anchor="middle">세 가지 기본 점검</text><text x="182" y="208" fill="#52606D" font-size="27" font-weight="400" text-anchor="middle">빈값 · 중복 날짜</text><text x="182" y="256" fill="#52606D" font-size="27" font-weight="400" text-anchor="middle">날짜 순서</text><path d="M320,195 L440,195" fill="none" stroke="#0B7A6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M424.0,187.0 L440,195 L424.0,203.0" fill="none" stroke="#0B7A6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="440" y="92" width="270" height="205" rx="12" fill="#FFFFFF" stroke="#C7D2E1" stroke-width="2" /><text x="575" y="155" fill="#0F2C59" font-size="29" font-weight="700" text-anchor="middle">결과와 해당 행</text><text x="575" y="211" fill="#0B7A6A" font-size="29" font-weight="400" text-anchor="middle">문제가 있는가?</text><path d="M710,195 H770 V70 H880" fill="none" stroke="#0B7A6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M770,70 L880,70" fill="none" stroke="#0B7A6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M864.0,62.0 L880,70 L864.0,78.0" fill="none" stroke="#0B7A6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="880" y="20" width="270" height="100" rx="12" fill="#E4F6F0" stroke="#C7D2E1" stroke-width="2" /><text x="1015" y="82" fill="#0F2C59" font-size="28" font-weight="700" text-anchor="middle">분석용 복사본</text><text x="809" y="53" fill="#0B7A6A" font-size="23" font-weight="400" text-anchor="middle">없음</text><path d="M710,195 H770 V300 H880" fill="none" stroke="#0B7A6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M770,300 L880,300" fill="none" stroke="#0B7A6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M864.0,292.0 L880,300 L864.0,308.0" fill="none" stroke="#0B7A6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="880" y="250" width="270" height="100" rx="12" fill="#FFF0DF" stroke="#C7D2E1" stroke-width="2" /><text x="1015" y="292" fill="#0F2C59" font-size="27" font-weight="700" text-anchor="middle">원래 행·이유 확인</text><text x="1015" y="329" fill="#52606D" font-size="22" font-weight="400" text-anchor="middle">처리 방법은 그 다음</text><text x="809" y="280" fill="#B45309" font-size="23" font-weight="400" text-anchor="middle">있음</text></svg><g data-ink="1"><rect x="112" y="172" width="377" height="281" rx="14" fill="none" stroke="#b45309" stroke-width="3"/></g><g data-ink="2"><rect x="1240" y="75" width="369" height="139" rx="14" fill="none" stroke="#b45309" stroke-width="3"/></g><g data-ink="3"><rect x="1240" y="385" width="369" height="139" rx="14" fill="none" stroke="#b45309" stroke-width="3"/></g><g data-beat="4" data-arrival="rise"><text x="864" y="625" font-size="40" fill="#086c70" text-anchor="middle" font-weight="700">수정은 원래 행과 이유를 확인한 다음</text></g></svg>