<svg style="font-family: Noto Sans CJK KR, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1728 670" class="teaching-board" role="img" aria-label="날짜를 찾고 같은 행의 종가를 읽는다"><title>날짜를 찾고 같은 행의 종가를 읽는다</title><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc" style="font-family:Noto Sans CJK KR,sans-serif" x="54" y="25" width="1620" height="530"><title id="title">한 날짜의 행에서 종가를 찾기</title><desc id="desc">2024년 1월 2일 행의 종가는 79600원이다. 날짜·종가·거래량은 서로 다른 열이다.</desc><rect width="1200" height="360" fill="#FFFFFF" /><rect x="110" y="28" width="900" height="300" rx="12" fill="#FFFFFF" stroke="#C7D2E1" stroke-width="2" /><text x="260" y="82" fill="#0F2C59" font-size="26" font-weight="700" text-anchor="middle">Date · 날짜</text><text x="560" y="82" fill="#0F2C59" font-size="26" font-weight="700" text-anchor="middle">Close · 종가(원)</text><text x="860" y="82" fill="#0F2C59" font-size="26" font-weight="700" text-anchor="middle">Volume · 거래량(주)</text><rect x="112" y="100" width="896" height="70" fill="#E4F6F0" /><text x="260" y="147" fill="#0F2C59" font-size="30" font-weight="400" text-anchor="middle">2024-01-02</text><text x="560" y="147" fill="#0F2C59" font-size="30" font-weight="400" text-anchor="middle">79,600</text><text x="860" y="147" fill="#0F2C59" font-size="30" font-weight="400" text-anchor="middle">17,142,847</text><text x="260" y="217" fill="#0F2C59" font-size="30" font-weight="400" text-anchor="middle">2024-01-03</text><text x="560" y="217" fill="#0F2C59" font-size="30" font-weight="400" text-anchor="middle">77,000</text><text x="860" y="217" fill="#0F2C59" font-size="30" font-weight="400" text-anchor="middle">21,753,644</text><text x="260" y="287" fill="#0F2C59" font-size="30" font-weight="400" text-anchor="middle">2024-01-04</text><text x="560" y="287" fill="#0F2C59" font-size="30" font-weight="400" text-anchor="middle">76,600</text><text x="860" y="287" fill="#0F2C59" font-size="30" font-weight="400" text-anchor="middle">15,324,439</text><g id="date-to-close" data-beat="3"><rect x="410" y="100" width="300" height="70" rx="12" fill="none" stroke="#C7D2E1" stroke-width="2" /><path d="M360,135 L410,135" fill="none" stroke="#0B7A6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M394.0,127.0 L410,135 L394.0,143.0" fill="none" stroke="#0B7A6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><g id="row-label" data-beat="2"><text x="42" y="141" fill="#0B7A6A" font-size="25" font-weight="400" text-anchor="middle">하루</text><path d="M67,135 L110,135" fill="none" stroke="#0B7A6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M94.0,127.0 L110,135 L94.0,143.0" fill="none" stroke="#0B7A6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g></svg><g data-ink="2"><rect x="197" y="190" width="408" height="100" rx="14" fill="none" stroke="#b45309" stroke-width="3"/></g><g data-ink="4"><rect x="1040" y="190" width="400" height="100" rx="14" fill="none" stroke="#b45309" stroke-width="3"/></g><g data-beat="4" data-arrival="rise"><text x="864" y="606" font-size="40" fill="#086c70" text-anchor="middle" font-weight="700">거래량 17,142,847주 · 그날 거래된 주식 수</text></g></svg>