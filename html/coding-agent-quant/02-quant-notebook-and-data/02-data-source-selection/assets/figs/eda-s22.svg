<svg style="font-family: Noto Sans CJK KR, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1728 670" class="teaching-board" role="img" aria-label="거래량 그림과 요약 통계를 요청한다"><title>거래량 그림과 요약 통계를 요청한다</title><rect x="60" y="35" width="1608" height="535" rx="22" fill="#fff" stroke="#c5d3da" stroke-width="3"/><text x="102" y="112" font-size="40" fill="#102e57" text-anchor="start" font-weight="700">에이전트에게 이렇게 요청합니다</text><g data-beat="2" data-arrival="rise"><text x="108" y="205" font-size="37" fill="#086c70" text-anchor="start" font-weight="700">막대 그래프</text><text x="425" y="205" font-size="39" fill="#102e57" text-anchor="start" font-weight="400">날짜별 거래량을 보여 주세요</text></g><g data-ink="2" data-underline-text="날짜별 거래량을 보여 주세요" data-underline-size="39" data-underline-width="456.7"><path d="M425,223 H881.7" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><g data-beat="3" data-arrival="rise"><text x="108" y="313" font-size="37" fill="#086c70" text-anchor="start" font-weight="700">요약값</text><text x="425" y="313" font-size="39" fill="#102e57" text-anchor="start" font-weight="400">평균과 중앙값을 서로 다른 점선으로</text></g><g data-ink="3" data-underline-text="평균과 중앙값을 서로 다른 점선으로" data-underline-size="39" data-underline-width="573.06"><path d="M425,331 H998.06" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><g data-beat="4" data-arrival="rise"><text x="108" y="421" font-size="37" fill="#086c70" text-anchor="start" font-weight="700">원래 행</text><text x="425" y="421" font-size="39" fill="#102e57" text-anchor="start" font-weight="400">거래량이 많은 상위 다섯 날</text></g><g data-ink="4" data-underline-text="거래량이 많은 상위 다섯 날" data-underline-size="39" data-underline-width="429.56"><path d="M425,439 H854.56" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>