<svg style="font-family: Noto Sans CJK KR, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1728 670" class="teaching-board" role="img" aria-label="평균은 합계를 개수로 나눈 값이다"><title>평균은 합계를 개수로 나눈 값이다</title><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc" style="font-family:Noto Sans CJK KR,sans-serif" x="54" y="8" width="1620" height="574"><title id="title">평균과 중앙값은 서로 다른 대표값이다</title><desc id="desc">설명용 숫자 1, 2, 2, 3, 12의 평균은 4이며 가운데 값은 2이다.</desc><rect width="1200" height="430" fill="#FFFFFF" /><rect x="35" y="35" width="1130" height="360" rx="12" fill="#FFFFFF" stroke="#C7D2E1" stroke-width="2" /><g id="value-0" data-beat="2"><circle cx="150" cy="115" r="48" fill="#E7EEF9" stroke="#C7D2E1" stroke-width="2" /><text x="150" y="132" fill="#0F2C59" font-size="40" font-weight="700" text-anchor="middle">1</text></g><g id="value-1" data-beat="2"><circle cx="370" cy="115" r="48" fill="#E7EEF9" stroke="#C7D2E1" stroke-width="2" /><text x="370" y="132" fill="#0F2C59" font-size="40" font-weight="700" text-anchor="middle">2</text></g><g id="value-2" data-beat="2"><circle cx="590" cy="115" r="48" fill="#E4F6F0" stroke="#0B7A6A" stroke-width="2" /><text x="590" y="132" fill="#0F2C59" font-size="40" font-weight="700" text-anchor="middle">2</text></g><g id="value-3" data-beat="2"><circle cx="810" cy="115" r="48" fill="#E7EEF9" stroke="#C7D2E1" stroke-width="2" /><text x="810" y="132" fill="#0F2C59" font-size="40" font-weight="700" text-anchor="middle">3</text></g><g id="value-4" data-beat="4"><circle cx="1030" cy="115" r="48" fill="#E7EEF9" stroke="#C7D2E1" stroke-width="2" /><text x="1030" y="132" fill="#0F2C59" font-size="40" font-weight="700" text-anchor="middle">12</text></g><path d="M102,185 H1078" fill="none" stroke="#C7D2E1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="150" y="222" fill="#52606D" font-size="24" font-weight="400" text-anchor="middle">작음</text><text x="1030" y="222" fill="#52606D" font-size="24" font-weight="400" text-anchor="middle">큼</text><text x="315" y="303" fill="#0F2C59" font-size="30" font-weight="700" text-anchor="start">평균  =  (1 + 2 + 2 + 3 + 12) ÷ 5  =  4</text><text x="315" y="353" fill="#0B7A6A" font-size="30" font-weight="700" text-anchor="start">중앙값  =  크기순 가운데 값  =  2</text><path d="M590,164 V240" fill="none" stroke="#0B7A6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></svg><g data-ink="3"><rect x="460" y="373" width="900" height="63" rx="14" fill="none" stroke="#b45309" stroke-width="3"/></g><g data-beat="4" data-arrival="rise"><text x="864" y="630" font-size="38" fill="#086c70" text-anchor="middle" font-weight="700">12처럼 큰 값이 평균을 끌어올립니다</text></g></svg>