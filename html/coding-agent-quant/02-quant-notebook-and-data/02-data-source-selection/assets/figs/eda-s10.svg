<svg style="font-family: Noto Sans CJK KR, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1728 670" class="teaching-board" role="img" aria-label="날짜처럼 보이는 글자와 날짜형을 구분한다"><title>날짜처럼 보이는 글자와 날짜형을 구분한다</title><g data-beat="1" data-arrival="rise"><image x="120" y="80" width="1130" height="450" preserveAspectRatio="xMidYMid meet" href="data:image/webp;base64,"/></g><g data-beat="2" data-arrival="rise"><rect x="1280" y="75" width="380" height="150" rx="22" fill="#f0f7fa" stroke="#c5d3da" stroke-width="3"/><text x="1310" y="137" font-size="38" fill="#102e57" text-anchor="start" font-weight="700">날짜형</text><text x="1310" y="195" font-size="32" fill="#536474" text-anchor="start" font-weight="400">Date</text></g><g data-beat="3" data-arrival="rise"><rect x="1280" y="270" width="380" height="150" rx="22" fill="#eff8f4" stroke="#c5d3da" stroke-width="3"/><text x="1310" y="332" font-size="38" fill="#102e57" text-anchor="start" font-weight="700">숫자형</text><text x="1310" y="390" font-size="32" fill="#536474" text-anchor="start" font-weight="400">Close · Volume</text></g><g data-beat="4" data-arrival="rise"><text x="864" y="588" font-size="48" fill="#086c70" text-anchor="middle" font-weight="700">자료형 + 열의 뜻 + 단위</text></g></svg>