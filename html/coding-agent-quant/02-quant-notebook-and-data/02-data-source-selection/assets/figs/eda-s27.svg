<svg style="font-family: Noto Sans CJK KR, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1728 670" class="teaching-board" role="img" aria-label="에이전트에게 내 문장을 대조하게 한다"><title>에이전트에게 내 문장을 대조하게 한다</title><g data-beat="1" data-arrival="rise"><rect x="65" y="70" width="680" height="365" rx="22" fill="#f3f7fa" stroke="#c5d3da" stroke-width="3"/><path d="M670,70 L670,135 L745,135" fill="none" stroke="#c5d3da" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="97" y="146" font-size="39" fill="#102e57" text-anchor="start" font-weight="700">내가 쓴 초안</text><text x="97" y="215" font-size="32" fill="#536474" text-anchor="start" font-weight="400">최고 종가 날짜</text><text x="97" y="293" font-size="32" fill="#536474" text-anchor="start" font-weight="400">7월 9일</text></g><g data-beat="2" data-arrival="rise"><rect x="980" y="70" width="680" height="365" rx="22" fill="#eff8f4" stroke="#c5d3da" stroke-width="3"/><path d="M1585,70 L1585,135 L1660,135" fill="none" stroke="#c5d3da" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="1012" y="146" font-size="39" fill="#102e57" text-anchor="start" font-weight="700">원래 행과 대조 후</text><text x="1012" y="215" font-size="32" fill="#536474" text-anchor="start" font-weight="400">같은 최고 종가</text><text x="1012" y="293" font-size="32" fill="#536474" text-anchor="start" font-weight="400">7월 9일과 10일</text></g><g data-ink="2" data-arrow="true"><path d="M745,253 L980,253" fill="none" stroke="#086c70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M961.0,242.0 L980,253 L961.0,264.0" fill="none" stroke="#086c70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><g data-ink="3"><rect x="997" y="246" width="646" height="91" rx="14" fill="none" stroke="#b45309" stroke-width="3"/></g><g data-beat="4" data-arrival="rise"><text x="864" y="564" font-size="42" fill="#086c70" text-anchor="middle" font-weight="700">직접 읽기 → 문장 쓰기 → 검토 요청</text></g></svg>