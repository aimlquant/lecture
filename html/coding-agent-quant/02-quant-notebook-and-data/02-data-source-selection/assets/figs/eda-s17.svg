<svg style="font-family: Noto Sans CJK KR, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1728 670" class="teaching-board" role="img" aria-label="날짜별 종가와 원래 행을 함께 요청한다"><title>날짜별 종가와 원래 행을 함께 요청한다</title><rect x="60" y="35" width="1608" height="535" rx="22" fill="#fff" stroke="#c5d3da" stroke-width="3"/><text x="102" y="112" font-size="40" fill="#102e57" text-anchor="start" font-weight="700">에이전트에게 이렇게 요청합니다</text><g data-beat="2" data-arrival="rise"><text x="108" y="205" font-size="37" fill="#086c70" text-anchor="start" font-weight="700">선 그래프</text><text x="425" y="205" font-size="39" fill="#102e57" text-anchor="start" font-weight="400">날짜별 종가를 선으로 보여 주세요</text></g><g data-ink="2" data-underline-text="날짜별 종가를 선으로 보여 주세요" data-underline-size="39" data-underline-width="537.19"><path d="M425,223 H962.19" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><g data-beat="3" data-arrival="rise"><text x="108" y="313" font-size="37" fill="#086c70" text-anchor="start" font-weight="700">축과 단위</text><text x="425" y="313" font-size="39" fill="#102e57" text-anchor="start" font-weight="400">가로축 날짜 · 세로축 종가(원)</text></g><g data-ink="3" data-underline-text="가로축 날짜 · 세로축 종가(원)" data-underline-size="39" data-underline-width="477.81"><path d="M425,331 H902.81" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><g data-beat="4" data-arrival="rise"><text x="108" y="421" font-size="37" fill="#086c70" text-anchor="start" font-weight="700">원래 행</text><text x="425" y="421" font-size="39" fill="#102e57" text-anchor="start" font-weight="400">최고·최저 종가가 나온 모든 행</text></g><g data-ink="4" data-underline-text="최고·최저 종가가 나온 모든 행" data-underline-size="39" data-underline-width="487.31"><path d="M425,439 H912.31" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>