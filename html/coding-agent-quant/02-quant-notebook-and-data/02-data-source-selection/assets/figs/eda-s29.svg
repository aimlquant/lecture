<svg style="font-family: Noto Sans CJK KR, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1728 670" class="teaching-board" role="img" aria-label="오류 연습은 원본의 복사본에서 한다"><title>오류 연습은 원본의 복사본에서 한다</title><g data-beat="1" data-arrival="rise"><rect x="60" y="80" width="620" height="390" rx="22" fill="#f3f8fa" stroke="#c5d3da" stroke-width="3"/><path d="M605,80 L605,145 L680,145" fill="none" stroke="#c5d3da" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="92" y="156" font-size="39" fill="#102e57" text-anchor="start" font-weight="700">원본 CSV</text><text x="92" y="225" font-size="32" fill="#536474" text-anchor="start" font-weight="400">값을 바꾸지 않고 보존</text><text x="92" y="282" font-size="32" fill="#536474" text-anchor="start" font-weight="400">첫 세 행만 복사</text></g><g data-ink="2" data-arrow="true"><path d="M680,275 L915,275" fill="none" stroke="#086c70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M896.0,264.0 L915,275 L896.0,286.0" fill="none" stroke="#086c70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><g data-beat="2" data-arrival="rise"><rect x="915" y="80" width="745" height="390" rx="22" fill="#fff7ee" stroke="#c5d3da" stroke-width="3"/><path d="M1585,80 L1585,145 L1660,145" fill="none" stroke="#c5d3da" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="947" y="156" font-size="39" fill="#102e57" text-anchor="start" font-weight="700">오류 연습 복사본</text><text x="947" y="225" font-size="32" fill="#536474" text-anchor="start" font-weight="400">종가 하나를 빈값으로</text><text x="947" y="310" font-size="32" fill="#536474" text-anchor="start" font-weight="400">같은 날짜 추가 · 순서 뒤집기</text></g><g data-ink="3"><rect x="935" y="185" width="704" height="225" rx="14" fill="none" stroke="#b45309" stroke-width="3"/></g><g data-beat="4" data-arrival="rise"><text x="864" y="571" font-size="43" fill="#086c70" text-anchor="middle" font-weight="700">의도적으로 만든 문제를 점검합니다</text></g></svg>