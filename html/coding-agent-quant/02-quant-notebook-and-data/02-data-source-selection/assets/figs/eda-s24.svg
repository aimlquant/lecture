<svg style="font-family: Noto Sans CJK KR, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1728 670" class="teaching-board" role="img" aria-label="그림과 표의 단위를 맞춰 읽는다"><title>그림과 표의 단위를 맞춰 읽는다</title><g data-beat="1" data-arrival="rise"><rect x="80" y="75" width="700" height="245" rx="22" fill="#f2f7fa" stroke="#c5d3da" stroke-width="3"/><text x="110" y="137" font-size="44" fill="#102e57" text-anchor="start" font-weight="700">표: 주</text><text x="110" y="195" font-size="32" fill="#536474" text-anchor="start" font-weight="400">21,738,603주</text></g><g data-beat="1" data-arrival="rise"><rect x="950" y="75" width="700" height="245" rx="22" fill="#eff8f4" stroke="#c5d3da" stroke-width="3"/><text x="980" y="137" font-size="44" fill="#102e57" text-anchor="start" font-weight="700">그림: 백만 주</text><text x="980" y="195" font-size="32" fill="#536474" text-anchor="start" font-weight="400">약 21.74백만 주</text></g><g data-ink="2" data-arrow="true"><path d="M780,200 L950,200" fill="none" stroke="#086c70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M931.0,189.0 L950,200 L931.0,211.0" fill="none" stroke="#086c70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><g data-beat="2" data-arrival="rise"><text x="864" y="403" font-size="54" fill="#086c70" text-anchor="middle" font-weight="700">약 2,174만 주</text></g><g data-beat="3" data-arrival="rise"><text x="120" y="516" font-size="42" fill="#102e57" text-anchor="start" font-weight="700">계산 대상: 파일에 있는 244행</text></g><g data-beat="4" data-arrival="rise"><text x="120" y="604" font-size="37" fill="#536474" text-anchor="start" font-weight="400">휴일을 새 행으로 넣어 0을 더하지 않았습니다</text></g></svg>