<svg style="font-family: Noto Sans CJK KR, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1728 670" class="teaching-board" role="img" aria-label="첫 요청은 표의 구조에 집중한다"><title>첫 요청은 표의 구조에 집중한다</title><rect x="60" y="35" width="1608" height="535" rx="22" fill="#fff" stroke="#c5d3da" stroke-width="3"/><text x="102" y="112" font-size="40" fill="#102e57" text-anchor="start" font-weight="700">에이전트에게 이렇게 요청합니다</text><g data-beat="2" data-arrival="rise"><text x="108" y="205" font-size="37" fill="#086c70" text-anchor="start" font-weight="700">미리보기와 크기</text><text x="425" y="205" font-size="39" fill="#102e57" text-anchor="start" font-weight="400">앞·뒤의 행, 전체 행 수와 열 수</text></g><g data-ink="2" data-underline-text="앞·뒤의 행, 전체 행 수와 열 수" data-underline-size="39" data-underline-width="479.75"><path d="M425,223 H904.75" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><g data-beat="3" data-arrival="rise"><text x="108" y="313" font-size="37" fill="#086c70" text-anchor="start" font-weight="700">열과 기간</text><text x="425" y="313" font-size="39" fill="#102e57" text-anchor="start" font-weight="400">열의 뜻·자료형, 가장 이른·늦은 날짜</text></g><g data-ink="3" data-underline-text="열의 뜻·자료형, 가장 이른·늦은 날짜" data-underline-size="39" data-underline-width="591.78"><path d="M425,331 H1016.78" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><g data-beat="4" data-arrival="rise"><text x="108" y="421" font-size="37" fill="#086c70" text-anchor="start" font-weight="700">실행과 읽기</text><text x="425" y="421" font-size="39" fill="#102e57" text-anchor="start" font-weight="400">새 셀을 실행한 뒤 출력 확인</text></g><g data-ink="4" data-underline-text="새 셀을 실행한 뒤 출력 확인" data-underline-size="39" data-underline-width="438.3"><path d="M425,439 H863.3" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>