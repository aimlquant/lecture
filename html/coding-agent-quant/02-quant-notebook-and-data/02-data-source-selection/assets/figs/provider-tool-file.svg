<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 465" role="img" aria-labelledby="title desc"><title id="title">직접 제공처에서 수집 도구를 거쳐 보존한 파일로 이어지는 경로</title><desc id="desc">이번 실습의 실제 경로는 네이버 금융에서 FinanceDataReader를 거쳐 가격 CSV로 이어진다. 메타데이터가 이 경로와 파일을 함께 설명한다.</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="18" refY="5" markerWidth="18" markerHeight="10" orient="auto"><path d="M0 0L18 5L0 10Z" fill="#0F2C59"/></marker></defs><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#0F172A;font-size:25px}.big{font-size:32px;font-weight:700}.small{font-size:23px;fill:#52606D}.teal{fill:#0B7A6A}.amber{fill:#B45309}.line{stroke:#0F2C59;stroke-width:3;fill:none;marker-end:url(#arrow)}.icon{fill:none;stroke:#0B7A6A;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="465" fill="#FFFFFF"/><g id="provider"><rect x="25" y="35" width="330" height="220" rx="12" fill="#E4F6F0" stroke="#C7D2E1"/><text x="190" y="158" text-anchor="middle" class="big">네이버 금융</text><text x="190" y="205" text-anchor="middle" class="small">직접 값을 제공</text></g><g id="collector"><rect x="435" y="35" width="330" height="220" rx="12" fill="#E4F6F0" stroke="#C7D2E1"/><text x="600" y="158" text-anchor="middle" class="big" style="font-size:29px">FinanceDataReader</text><text x="600" y="205" text-anchor="middle" class="small">표로 읽어 오는 도구</text></g><g id="file"><rect x="845" y="35" width="330" height="220" rx="12" fill="#E4F6F0" stroke="#C7D2E1"/><text x="1010" y="158" text-anchor="middle" class="big">가격 CSV</text><text x="1010" y="205" text-anchor="middle" class="small">내가 보존한 입력</text></g><g id="icons"><path class="icon" d="M168 65h44v43h-44zM168 77h44M180 88h7m8 0h7m-22 10h7m8 0h7"/><path class="icon" d="M580 66l-18 20 18 20m40-40 18 20-18 20m-12-46-16 52"/><path class="icon" d="M991 65h33l14 14v31h-47zM1024 65v15h14M1001 91h26m-26 9h26"/></g><g id="data-flow"><path class="line" d="M355 145H435"/><path class="line" d="M765 145H845"/></g><g id="provenance"><path d="M190 278v22h820v-22M600 300v30" fill="none" stroke="#C7D2E1" stroke-width="3"/><rect x="145" y="330" width="910" height="110" rx="12" fill="#E7EEF9"/><text x="600" y="375" text-anchor="middle" class="big">metadata.json · 출처와 파일을 함께 기록</text><text x="600" y="414" text-anchor="middle" class="small">요청 기간 / 수집 시각 / 도구 버전 / 파일 해시</text></g></svg>