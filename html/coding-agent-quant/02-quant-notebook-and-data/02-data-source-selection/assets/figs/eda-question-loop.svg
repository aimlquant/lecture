<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 295" role="img" aria-labelledby="title desc" style="font-family:Noto Sans CJK KR,sans-serif"><title id="title">질문과 실행 결과를 연결하는 EDA 흐름</title><desc id="desc">네 단계가 연결되고 마지막 해석에서 다음 질문으로 돌아간다.</desc><rect width="1200" height="295" fill="#FFFFFF"/><g id="stage-1"><rect x="40" y="35" width="250" height="150" rx="12" fill="#E4F6F0" stroke="#C7D2E1" stroke-width="2"/><text x="165" y="90" fill="#0F2C59" font-size="30" font-weight="700" text-anchor="middle">질문 정하기</text><text x="165" y="144" fill="#52606D" font-size="24" font-weight="400" text-anchor="middle">무엇이 궁금한가?</text></g><g id="arrow-0"><path d="M290,110 L330,110" fill="none" stroke="#0B7A6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M314.0,102.0 L330,110 L314.0,118.0" fill="none" stroke="#0B7A6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><g id="stage-2"><rect x="330" y="35" width="250" height="150" rx="12" fill="#E7EEF9" stroke="#C7D2E1" stroke-width="2"/><text x="455" y="90" fill="#0F2C59" font-size="30" font-weight="700" text-anchor="middle">에이전트에 요청</text><text x="455" y="144" fill="#52606D" font-size="24" font-weight="400" text-anchor="middle">짧은 셀 생성·추가</text></g><g id="arrow-1"><path d="M580,110 L620,110" fill="none" stroke="#0B7A6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M604.0,102.0 L620,110 L604.0,118.0" fill="none" stroke="#0B7A6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><g id="stage-3"><rect x="620" y="35" width="250" height="150" rx="12" fill="#E7EEF9" stroke="#C7D2E1" stroke-width="2"/><text x="745" y="90" fill="#0F2C59" font-size="30" font-weight="700" text-anchor="middle">셀 실행·확인</text><text x="745" y="144" fill="#52606D" font-size="24" font-weight="400" text-anchor="middle">표 · 차트 · 요약값</text></g><g id="arrow-2"><path d="M870,110 L910,110" fill="none" stroke="#0B7A6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M894.0,102.0 L910,110 L894.0,118.0" fill="none" stroke="#0B7A6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><g id="stage-4"><rect x="910" y="35" width="250" height="150" rx="12" fill="#E4F6F0" stroke="#C7D2E1" stroke-width="2"/><text x="1035" y="90" fill="#0F2C59" font-size="30" font-weight="700" text-anchor="middle">내 말로 읽기</text><text x="1035" y="144" fill="#52606D" font-size="24" font-weight="400" text-anchor="middle">관찰과 다음 질문</text></g><g id="next-question"><path d="M1035,185 V260 H165 V185" fill="none" stroke="#0B7A6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M157,201 L165,185 L173,201" fill="none" stroke="#0B7A6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="242" fill="#0B7A6A" font-size="26" font-weight="400" text-anchor="middle">읽은 결과에서 다음 질문이 생긴다</text></g></svg>