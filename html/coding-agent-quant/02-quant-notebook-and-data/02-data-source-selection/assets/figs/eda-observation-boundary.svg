<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc" style="font-family:Noto Sans CJK KR,sans-serif"><title id="title">관찰한 사실과 추가 근거가 필요한 해석</title><desc id="desc">관찰에는 대상·기간·날짜·수치·단위가 있고 원인과 예측에는 추가 근거가 필요하다.</desc><rect width="1200" height="340" fill="#FFFFFF"/><g id="claim-0"><rect x="50" y="35" width="500" height="270" rx="12" fill="#E4F6F0" stroke="#C7D2E1" stroke-width="2"/><text x="300" y="95" fill="#0B7A6A" font-size="30" font-weight="700" text-anchor="middle">관찰</text><text x="300" y="158" fill="#0F2C59" font-size="29" font-weight="400" text-anchor="middle">이 파일 · 이 기간</text><text x="300" y="210" fill="#0F2C59" font-size="29" font-weight="400" text-anchor="middle">날짜 + 값 + 단위</text><text x="300" y="262" fill="#0F2C59" font-size="29" font-weight="400" text-anchor="middle">표·차트에서 확인</text></g><g id="claim-1"><rect x="650" y="35" width="500" height="270" rx="12" fill="#FFF0DF" stroke="#C7D2E1" stroke-width="2"/><text x="900" y="95" fill="#B45309" font-size="30" font-weight="700" text-anchor="middle">추가 확인이 필요한 해석</text><text x="900" y="158" fill="#0F2C59" font-size="29" font-weight="400" text-anchor="middle">왜 움직였을까?</text><text x="900" y="210" fill="#0F2C59" font-size="29" font-weight="400" text-anchor="middle">앞으로도 그럴까?</text><text x="900" y="262" fill="#0F2C59" font-size="29" font-weight="400" text-anchor="middle">원인·예측의 근거 필요</text></g></svg>