<svg style="font-family: Noto Sans CJK KR, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1728 670" class="teaching-board" role="img" aria-label="빈값과 숫자 0은 다른 뜻이다"><title>빈값과 숫자 0은 다른 뜻이다</title><g data-beat="1" data-arrival="rise"><rect x="80" y="70" width="700" height="260" rx="22" fill="#fff7ed" stroke="#c5d3da" stroke-width="3"/><text x="110" y="132" font-size="48" fill="#102e57" text-anchor="start" font-weight="700">빈값</text><text x="110" y="190" font-size="32" fill="#536474" text-anchor="start" font-weight="400">그 칸에 값이 기록되지 않음</text></g><g data-beat="2" data-arrival="rise"><rect x="950" y="70" width="700" height="260" rx="22" fill="#eff8f4" stroke="#c5d3da" stroke-width="3"/><text x="980" y="132" font-size="48" fill="#102e57" text-anchor="start" font-weight="700">숫자 0</text><text x="980" y="190" font-size="32" fill="#536474" text-anchor="start" font-weight="400">그 칸에 0이 기록되어 있음</text></g><g data-beat="2" data-arrival="rise"><text x="864" y="245" font-size="80" fill="#536474" text-anchor="middle" font-weight="700">≠</text></g><g data-beat="3" data-arrival="rise"><text x="100" y="430" font-size="43" fill="#086c70" text-anchor="start" font-weight="700">빈값 점검 → 받은 행 안의 칸</text></g><g data-beat="4" data-arrival="rise"><text x="100" y="541" font-size="43" fill="#102e57" text-anchor="start" font-weight="700">날짜 행 전체가 빠졌는지는 별도 확인</text></g></svg>