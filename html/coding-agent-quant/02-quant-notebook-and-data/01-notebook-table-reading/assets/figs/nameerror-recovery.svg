<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 285" role="img" aria-labelledby="title desc">
<title id="title">순서 오류에서 전체 재현까지</title><desc id="desc">새 커널의 순서 오류에서 없는 이름을 확인하고 정의 셀을 실행한 뒤 실패 셀을 다시 실행한다. 마지막에 커널 재시작과 전체 실행으로 순서를 검증한다.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="10" refX="18" refY="5" orient="auto"><path d="M0 0L18 5L0 10Z" fill="#0F2C59"/></marker></defs>
<g id="background"><rect width="1200" height="285" fill="#FFFFFF"/></g>
<g font-family='"Noto Sans CJK KR","Noto Sans KR",sans-serif' fill="#0F172A"><g id="connectors"><path d="M215 142H265" fill="none" stroke="#0F2C59" stroke-width="3" marker-end="url(#arrow)"/><path d="M455 142H505" fill="none" stroke="#0F2C59" stroke-width="3" marker-end="url(#arrow)"/><path d="M695 142H745" fill="none" stroke="#0F2C59" stroke-width="3" marker-end="url(#arrow)"/><path d="M935 142H985" fill="none" stroke="#0F2C59" stroke-width="3" marker-end="url(#arrow)"/></g><g id="nodes"><g id="step-01"><rect x="25" y="45" width="190" height="195" rx="12" fill="#FFF1F4" stroke="#C7D2E1" stroke-width="2"/></g><g id="step-02"><rect x="265" y="45" width="190" height="195" rx="12" fill="#FFF0DF" stroke="#C7D2E1" stroke-width="2"/></g><g id="step-03"><rect x="505" y="45" width="190" height="195" rx="12" fill="#E7EEF9" stroke="#C7D2E1" stroke-width="2"/></g><g id="step-04"><rect x="745" y="45" width="190" height="195" rx="12" fill="#E7EEF9" stroke="#C7D2E1" stroke-width="2"/></g><g id="step-05"><rect x="985" y="45" width="190" height="195" rx="12" fill="#E4F6F0" stroke="#C7D2E1" stroke-width="2"/></g></g><g id="labels"><text x="120" y="91" text-anchor="middle" font-size="23" font-weight="700">뒤 셀 실행</text><text x="120" y="148" text-anchor="middle" font-size="23" font-weight="400">NameError</text><text x="120" y="199" text-anchor="middle" font-size="22" font-weight="400">prices</text><text x="360" y="91" text-anchor="middle" font-size="23" font-weight="700">없는 이름 확인</text><text x="360" y="148" text-anchor="middle" font-size="23" font-weight="400">실패 줄</text><text x="360" y="199" text-anchor="middle" font-size="22" font-weight="400">정의 셀</text><text x="600" y="91" text-anchor="middle" font-size="23" font-weight="700">정의 셀 실행</text><text x="600" y="148" text-anchor="middle" font-size="23" font-weight="400">CSV 읽기</text><text x="600" y="199" text-anchor="middle" font-size="22" font-weight="400">prices 생성</text><text x="840" y="91" text-anchor="middle" font-size="23" font-weight="700">실패 셀 재실행</text><text x="840" y="148" text-anchor="middle" font-size="23" font-weight="400">head(4)</text><text x="840" y="199" text-anchor="middle" font-size="22" font-weight="400">표 확인</text><text x="1080" y="91" text-anchor="middle" font-size="23" font-weight="700">커널 재시작</text><text x="1080" y="148" text-anchor="middle" font-size="23" font-weight="400">Run All</text><text x="1080" y="199" text-anchor="middle" font-size="22" font-weight="400">전체 재현</text></g></g></svg>
