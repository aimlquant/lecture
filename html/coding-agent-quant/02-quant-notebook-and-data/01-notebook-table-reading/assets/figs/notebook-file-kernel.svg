<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">노트북 문서와 현재 커널의 상태</title><desc id="desc">문서에는 코드와 실행 번호, 출력이 표시되고 커널에는 현재 실행으로 만든 이름과 값이 있다. 문서를 저장하면 코드와 표시된 출력이 ipynb 파일에 보존된다.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="10" refX="18" refY="5" orient="auto"><path d="M0 0L18 5L0 10Z" fill="#0F2C59"/></marker></defs>
<g id="background"><rect width="1200" height="430" fill="#FFFFFF"/></g>
<g font-family='"Noto Sans CJK KR","Noto Sans KR",sans-serif' fill="#0F172A"><g id="nodes"><rect x="60" y="35" width="450" height="350" rx="12" fill="#FFFFFF" stroke="#C7D2E1" stroke-width="2"/><rect x="690" y="35" width="450" height="350" rx="12" fill="#FFFFFF" stroke="#C7D2E1" stroke-width="2"/><rect x="80" y="55" width="410" height="70" rx="12" fill="#E7EEF9" stroke="#C7D2E1" stroke-width="2"/><rect x="710" y="55" width="410" height="70" rx="12" fill="#E4F6F0" stroke="#C7D2E1" stroke-width="2"/></g><g id="labels"><text x="285" y="100" text-anchor="middle" font-size="29" font-weight="700">노트북 문서 · .ipynb</text><text x="915" y="100" text-anchor="middle" font-size="29" font-weight="700">현재 커널</text><text x="285" y="185" text-anchor="middle" font-size="25" font-weight="400">코드 셀</text><text x="915" y="185" text-anchor="middle" font-size="25" font-weight="400">prices 같은 이름과 값</text><text x="285" y="255" text-anchor="middle" font-size="25" font-weight="400">실행 번호 [1] [2] [3]</text><text x="915" y="255" text-anchor="middle" font-size="25" font-weight="400">불러온 패키지</text><text x="285" y="325" text-anchor="middle" font-size="25" font-weight="400">표 · 오류 · 그림 출력</text><text x="915" y="325" text-anchor="middle" font-size="25" font-weight="400">실행 중인 작업</text></g><g id="connectors"><path d="M510 185H690" fill="none" stroke="#0F2C59" stroke-width="3" marker-end="url(#arrow)"/><path d="M690 285H510" fill="none" stroke="#0F2C59" stroke-width="3" marker-end="url(#arrow)"/></g><g id="annotations"><text x="600" y="165" text-anchor="middle" font-size="21" font-weight="700">셀 실행</text><text x="600" y="325" text-anchor="middle" font-size="21" font-weight="700">출력 갱신</text></g></g></svg>
