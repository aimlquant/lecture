<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
<title id="title">가격표의 구조를 읽는 네 묶음</title><desc id="desc">표를 크기와 이름, 인덱스와 자료형, 결측과 중복, 날짜 정렬과 범위로 나누어 확인한다.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="10" refX="18" refY="5" orient="auto"><path d="M0 0L18 5L0 10Z" fill="#0F2C59"/></marker></defs>
<g id="background"><rect width="1200" height="450" fill="#FFFFFF"/></g>
<g font-family='"Noto Sans CJK KR","Noto Sans KR",sans-serif' fill="#0F172A"><g id="connectors"><path d="M600 130V200M150 200H1050" fill="none" stroke="#0F2C59" stroke-width="3"/><path d="M150 200V255" fill="none" stroke="#0F2C59" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 200V255" fill="none" stroke="#0F2C59" stroke-width="3" marker-end="url(#arrow)"/><path d="M750 200V255" fill="none" stroke="#0F2C59" stroke-width="3" marker-end="url(#arrow)"/><path d="M1050 200V255" fill="none" stroke="#0F2C59" stroke-width="3" marker-end="url(#arrow)"/></g><g id="nodes"><rect x="400" y="25" width="400" height="105" rx="12" fill="#E7EEF9" stroke="#0F2C59" stroke-width="2"/><g id="check-group-1"><rect x="30" y="255" width="240" height="170" rx="12" fill="#FFFFFF" stroke="#C7D2E1" stroke-width="2"/></g><g id="check-group-2"><rect x="330" y="255" width="240" height="170" rx="12" fill="#FFFFFF" stroke="#C7D2E1" stroke-width="2"/></g><g id="check-group-3"><rect x="630" y="255" width="240" height="170" rx="12" fill="#FFFFFF" stroke="#C7D2E1" stroke-width="2"/></g><g id="check-group-4"><rect x="930" y="255" width="240" height="170" rx="12" fill="#FFFFFF" stroke="#C7D2E1" stroke-width="2"/></g></g><g id="labels"><text x="600" y="71" text-anchor="middle" font-size="30" font-weight="700">가격표</text><text x="600" y="108" text-anchor="middle" font-size="23" font-weight="400">DataFrame</text><text x="150" y="300" text-anchor="middle" font-size="25" font-weight="700">크기·이름</text><text x="150" y="351" text-anchor="middle" font-size="23" font-weight="400">행 × 열</text><text x="150" y="390" text-anchor="middle" font-size="23" font-weight="400">열 이름</text><text x="450" y="300" text-anchor="middle" font-size="25" font-weight="700">인덱스·자료형</text><text x="450" y="351" text-anchor="middle" font-size="23" font-weight="400">기본 행 번호</text><text x="450" y="390" text-anchor="middle" font-size="23" font-weight="400">Date 자료형</text><text x="750" y="300" text-anchor="middle" font-size="25" font-weight="700">결측·중복</text><text x="750" y="351" text-anchor="middle" font-size="23" font-weight="400">비어 있는 값</text><text x="750" y="390" text-anchor="middle" font-size="23" font-weight="400">겹치는 날짜</text><text x="1050" y="300" text-anchor="middle" font-size="25" font-weight="700">날짜 순서·범위</text><text x="1050" y="351" text-anchor="middle" font-size="23" font-weight="400">오름차순 여부</text><text x="1050" y="390" text-anchor="middle" font-size="23" font-weight="400">최소·최대 날짜</text></g></g></svg>
