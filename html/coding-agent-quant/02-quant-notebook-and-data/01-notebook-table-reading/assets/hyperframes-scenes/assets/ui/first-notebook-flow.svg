<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
<title id="title">한국어 요청에서 노트북 실행 결과까지</title><desc id="desc">사용자가 한국어로 요청하면 Codex가 ipynb 파일을 만든다. 사용자는 Python 커널을 선택해 코드를 실행하고 출력을 확인한다.</desc>
<defs><marker id="arrow" viewBox="0 0 18 10" refX="18" refY="5" markerWidth="18" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L18 5L0 10Z" fill="#0F2C59"/></marker></defs>
<g id="background"><rect width="1200" height="290" fill="#fff"/></g>
<g font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" fill="#0F172A"><g id="step-1"><rect x="30" y="80" width="240" height="150" rx="12" fill="#F1F5F9" stroke="#C7D2E1" stroke-width="1.5"/><text x="150" y="49" text-anchor="middle" font-size="25" fill="#52606D">사람이 요청</text><text x="150" y="143" text-anchor="middle" font-size="32" font-weight="700">한국어 요청문</text><text x="150" y="189" text-anchor="middle" font-size="23" fill="#52606D">무엇을 만들지 적기</text></g><g id="connector-1"><path d="M270 155H330" fill="none" stroke="#0F2C59" stroke-width="3" marker-end="url(#arrow)"/></g><g id="step-2"><rect x="330" y="80" width="240" height="150" rx="12" fill="#E4F6F0" stroke="#C7D2E1" stroke-width="1.5"/><text x="450" y="49" text-anchor="middle" font-size="25" fill="#52606D">Codex가 작성</text><text x="450" y="143" text-anchor="middle" font-size="32" font-weight="700">ipynb 파일</text><text x="450" y="189" text-anchor="middle" font-size="23" fill="#52606D">설명과 코드 만들기</text></g><g id="connector-2"><path d="M570 155H630" fill="none" stroke="#0F2C59" stroke-width="3" marker-end="url(#arrow)"/></g><g id="step-3"><rect x="630" y="80" width="240" height="150" rx="12" fill="#F1F5F9" stroke="#C7D2E1" stroke-width="1.5"/><text x="750" y="49" text-anchor="middle" font-size="25" fill="#52606D">사람이 실행</text><text x="750" y="143" text-anchor="middle" font-size="32" font-weight="700">Python 커널</text><text x="750" y="189" text-anchor="middle" font-size="23" fill="#52606D">코드를 실행할 환경</text></g><g id="connector-3"><path d="M870 155H930" fill="none" stroke="#0F2C59" stroke-width="3" marker-end="url(#arrow)"/></g><g id="step-4"><rect x="930" y="80" width="240" height="150" rx="12" fill="#F1F5F9" stroke="#C7D2E1" stroke-width="1.5"/><text x="1050" y="49" text-anchor="middle" font-size="25" fill="#52606D">사람이 확인</text><text x="1050" y="143" text-anchor="middle" font-size="32" font-weight="700">셀 아래 출력</text><text x="1050" y="189" text-anchor="middle" font-size="23" fill="#52606D">예상 결과와 비교</text></g></g></svg>