<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img"><title>달력과 가격표로 공란을 나누기</title><desc>비거래일의 빈칸과 거래일의 누락을 구분한 뒤 행 자체의 유무를 확인한다.</desc><defs><marker preserveAspectRatio="none" id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52606D"/></marker></defs><style>text{font-family:'Noto Sans CJK KR',sans-serif;fill:#0F172A;font-size:27px}.small{font-size:23px}.label{font-weight:700}.line{stroke:#52606D;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="480" fill="white"/><g id="connectors"><path class="line" d="M390 100H530"/><path class="line" d="M800 100H1010V170"/><path class="line" d="M670 140V280"/><path class="line" d="M670 355V400H870"/><path class="line" d="M530 320H390"/></g><g id="nodes"><rect x="50" y="60" width="340" height="80" rx="12" fill="#E7EEF9"/><rect x="530" y="60" width="270" height="80" rx="12" fill="#E7EEF9"/><rect x="870" y="170" width="280" height="90" rx="12" fill="#E4F6F0"/><rect x="530" y="280" width="270" height="75" rx="12" fill="#E7EEF9"/><rect x="110" y="280" width="280" height="80" rx="12" fill="#FFF0DF"/><rect x="870" y="360" width="280" height="80" rx="12" fill="#FFF0DF"/></g><g id="labels"><text x="220" y="110" text-anchor="middle" class="label">가격이 보이지 않음</text><text x="665" y="110" text-anchor="middle">거래일인가?</text><text x="1010" y="210" text-anchor="middle">주말·설정 휴장</text><text x="1010" y="242" text-anchor="middle" class="small">9/5 · 9/4</text><text x="665" y="327" text-anchor="middle">행이 있는가?</text><text x="250" y="314" text-anchor="middle">거래일 행 누락</text><text x="250" y="348" text-anchor="middle" class="small">9/3 · 원인 미확인</text><text x="1010" y="394" text-anchor="middle">행의 가격 빈값</text><text x="1010" y="428" text-anchor="middle" class="small">9/9 · 원인 미확인</text><text x="860" y="80">아니요</text><text x="688" y="213">예</text><text x