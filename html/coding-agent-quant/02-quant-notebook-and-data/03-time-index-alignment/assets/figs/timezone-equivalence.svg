<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img"><title>같은 순간의 두 시간대 표기</title><desc>한국 시각에서 아홉 시간을 빼면 UTC가 된다. 두 표현은 같은 순간을 가리킨다.</desc><defs><marker preserveAspectRatio="none" id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52606D"/></marker></defs><style>text{font-family:'Noto Sans CJK KR',sans-serif;fill:#0F172A;font-size:27px}.small{font-size:23px}.label{font-weight:700}.line{stroke:#52606D;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="310" fill="white"/><g id="connectors"><path class="line" d="M490 110H710"/><path class="line" d="M490 240H710"/></g><g id="nodes"><rect x="40" y="65" width="450" height="90" rx="12" fill="#E7EEF9"/><rect x="710" y="65" width="450" height="90" rx="12" fill="#E4F6F0"/><rect x="40" y="195" width="450" height="90" rx="12" fill="#E7EEF9"/><rect x="710" y="195" width="450" height="90" rx="12" fill="#E4F6F0"/></g><g id="labels"><text x="265" y="38" text-anchor="middle" class="label">UTC+09:00</text><text x="935" y="38" text-anchor="middle" class="label">UTC · Z</text><text x="265" y="120" text-anchor="middle">9/8 09:00 +09:00</text><text x="935" y="120" text-anchor="middle">9/8 00:00Z</text><text x="265" y="250" text-anchor="middle">9/8 18:00 +09:00</text><text x="935" y="250" text-anchor="middle">9/8 09:00Z</text><text x="600" y="94" text-anchor="middle">−9시간</text><text x="600" y="223" text-anchor="middle">−9시간</text></g></svg>