    <text class="body" x="344" y="211"><tspan x="344">계산식·조건·순서를</tspan><tspan x="344" dy="31">미리 고정</tspan></text>
  </g>
  <path class="shaft" d="M568 180H592"/>
  <path class="head" d="M608 180L588 168V192Z"/>
