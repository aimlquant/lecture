<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">입력에서 과거 검증까지 이어지는 네 단계</title>
  <desc id="desc">최종 영상 s05의 완성 화면을 바탕으로 입력, 명시적 규칙, 거래 판단, 과거 검증이 차례로 이어지는 구조를 리포트용 정적 벡터로 옮겼다.</desc>
  <metadata>HyperFrames s05 · final-video SHA256 1e445c52604ecfe73ebe61401c7a0a5376183baac02d47a111815bfa80d70c17</metadata>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#091F40" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif; }
      .card { fill:#FFFFFF; stroke:#C7D2E1; stroke-width:2; filter:url(#shadow); }
      .step { fill:#0B7A6A; font-size:19px; font-weight:700; letter-spacing:1px; }
      .name { fill:#0F2C59; font-size:31px; font-weight:700; }
      .body { fill:#52606D; font-size:20px; font-weight:400; }
      .shaft { fill:none; stroke:#0F2C59; stroke-width:6; stroke-linecap:round; }
      .head { fill:#0F2C59; }
    </style>
  </defs>
  <rect width="1200" height="360" fill="#FFFFFF"/>
  <g>
