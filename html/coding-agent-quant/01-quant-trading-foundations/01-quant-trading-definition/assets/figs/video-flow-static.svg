    <text class="step" x="52" y="103">STEP 01</text>
    <text class="name" x="52" y="159">입력</text>
    <text class="body" x="52" y="211"><tspan x="52">어떤 자료를</tspan><tspan x="52" dy="31">언제 읽는가</tspan></text>
  </g>
  <path class="shaft" d="M276 180H300"/>
