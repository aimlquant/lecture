<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">네 관문이 검증 가능한 전략 후보로 모이는 구조</title>
  <desc id="desc">입력, 판단 기준, 행동, 과거 검증의 네 관문이 가로로 이어지고, 각 카드 아래 면 중앙에서 내려온 선이 공통 브래킷으로 모여 검증 가능한 전략 후보에 닿는다.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto">
      <path d="M0 0L18 5L0 10Z" fill="#0F2C59"/>
    </marker>
    <style>
      text { font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif; fill:#0F172A; }
      .eyebrow { font-size:18px; font-weight:700; letter-spacing:1px; fill:#0B7A6A; }
      .gate-title { font-size:30px; font-weight:700; fill:#0F2C59; }
      .gate-body { font-size:21px; font-weight:400; fill:#52606D; }
      .result { font-size:30px; font-weight:700; fill:#0B7A6A; }
      .gate { fill:#FFFFFF; stroke:#C7D2E1; stroke-width:2; }
      .gate-final { fill:#E4F6F0; stroke:#0B7A6A; stroke-width:2; }
      .connector { fill:none; stroke:#0F2C59; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .arrow { fill:none; stroke:#0F2C59; stroke-width:5; stroke-linecap:round; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="500" fill="#FFFFFF"/>

  <g>
    <rect class="gate" x="42" y="28" width="240" height="182" rx="18"/>
    <text class="eyebrow" x="72" y="70">01</text>
    <text class="gate-title" x="72" y="116">입력</text>
    <text class="gate-body" x="72" y="156">자료 · 값 · 시점</text>
  </g>
  <path class="arrow" d="M282 119H320"/>
  <g>
    <rect class="gate" x="320" y="28" width="240" height="182" rx="18"/>
    <text class="eyebrow" x="350" y="70">02</text>
    <text class="gate-title" x="350" y="116">판단 기준</text>
    <text class="gate-body" x="350" y="156">계산 · 조건 · 순서</text>
  </g>
  <path class="arrow" d="M560 119H598"/>
  <g>
    <rect class="gate" x="598" y="28" width="240" height="182" rx="18"/>
    <text class="eyebrow" x="628" y="70">03</text>
    <text class="gate-title" x="628" y="116">행동</text>
    <text class="gate-body" x="628" y="156">매수 · 매도 · 보유</text>
  </g>
  <path class="arrow" d="M838 119H876"/>
  <g>
    <rect class="gate-final" x="876" y="28" width="282" height="182" rx="18"/>
    <text class="eyebrow" x="906" y="70">04</text>
    <text class="gate-title" x="906" y="116">과거 검증</text>
    <text class="gate-body" x="906" y="156">당시 자료로 재현</text>
  </g>

  <path class="connector" d="M162 210V280H1017V210"/>
  <path class="connector" d="M440 210V280"/>
  <path class="connector" d="M718 210V280"/>
  <path class="arrow" d="M590 280V350"/>

  <rect x="340" y="350" width="500" height="92" rx="46" fill="#E4F6F0" stroke="#0B7A6A" stroke-width="2"/>
  <text class="result" x="590" y="406" text-anchor="middle">검증 가능한 전략 후보</text>
</svg>
