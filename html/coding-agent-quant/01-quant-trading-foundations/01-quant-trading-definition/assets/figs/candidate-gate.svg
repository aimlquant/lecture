<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">네 관문이 검증 가능한 퀀트 전략 후보로 모이는 구조</title>
  <desc id="desc">입력, 판단 기준, 행동, 과거 검증의 네 관문이 차례로 이어지고, 각 관문의 아래 면 중앙에서 내려온 선이 하나의 브래킷으로 모여 검증 가능한 퀀트 전략 후보에 닿는다.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto">
      <path d="M0 0L18 5L0 10Z" fill="#0F2C59"/>
    </marker>
    <style>
      text { font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif; fill:#0F172A; }
      .eyebrow { font-size:18px; font-weight:700; letter-spacing:1px; fill:#0B7A6A; }
      .gate-title { font-size:30px; font-weight:700; fill:#0F2C59; }
      .gate-body { font-size:21px; font-weight:400; fill:#52606D; }
      .result-label { font-size:17px; font-weight:700; letter-spacing:1px; fill:#0B7A6A; }
      .result { font-size:30px; font-weight:700; fill:#0B7A6A; }
      .gate { fill:#FFFFFF; stroke:#C7D2E1; stroke-width:2; }
      .gate-final { fill:#E4F6F0; stroke:#0B7A6A; stroke-width:2; }
      .connector { fill:none; stroke:#0F2C59; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .arrow { fill:none; stroke:#0F2C59; stroke-width:5; stroke-linecap:round; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="520" fill="#FFFFFF"/>

  <g>
    <rect class="gate" x="42" y="34" width="240" height="182" rx="18"/>
    <text class="eyebrow" x="72" y="76">01</text>
    <text class="gate-title" x="72" y="122">입력</text>
    <text class="gate-body" x="72" y="162">자료 · 값 · 시점</text>
  </g>
  <path class="arrow" d="M282 125H320"/>
  <g>
    <rect class="gate" x="320" y="34" width="240" height="182" rx="18"/>
    <text class="eyebrow" x="350" y="76">02</text>
    <text class="gate-title" x="350" y="122">판단 기준</text>
    <text class="gate-body" x="350" y="162">계산 · 조건 · 순서</text>
  </g>
  <path class="arrow" d="M560 125H598"/>
  <g>
    <rect class="gate" x="598" y="34" width="240" height="182" rx="18"/>
    <text class="eyebrow" x="628" y="76">03</text>
    <text class="gate-title" x="628" y="122">행동</text>
    <text class="gate-body" x="628" y="162">매수 · 매도 · 보유</text>
  </g>
  <path class="arrow" d="M838 125H876"/>
  <g>
    <rect class="gate-final" x="876" y="34" width="282" height="182" rx="18"/>
    <text class="eyebrow" x="906" y="76">04</text>
    <text class="gate-title" x="906" y="122">과거 검증</text>
    <text class="gate-body" x="906" y="162">당시 자료로 재현</text>
  </g>

  <path class="connector" d="M162 216V286H1017V216"/>
  <path class="connector" d="M440 216V286"/>
  <path class="connector" d="M718 216V286"/>
  <path class="arrow" d="M590 286V358"/>

  <rect x="330" y="358" width="520" height="104" rx="52" fill="#E4F6F0" stroke="#0B7A6A" stroke-width="2"/>
  <text class="result-label" x="590" y="396" text-anchor="middle">FOUR GATES CONNECTED</text>
  <text class="result" x="590" y="436" text-anchor="middle">검증 가능한 퀀트 전략 후보</text>
</svg>
