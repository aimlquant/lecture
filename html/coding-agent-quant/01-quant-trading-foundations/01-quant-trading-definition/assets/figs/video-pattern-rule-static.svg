<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">주관적 차트 모양을 계산 가능한 조건으로 바꾸는 과정</title>
  <desc id="desc">최종 영상 s13의 헤드 앤 숄더 곡선과 네 기준 카드를 사용해 봉우리 구조, 높이 허용치, 시간 간격, 행동 조건으로 바꾸는 과정을 보여 준다.</desc>
  <metadata>HyperFrames s13 · final-video SHA256 1e445c52604ecfe73ebe61401c7a0a5376183baac02d47a111815bfa80d70c17</metadata>
