<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">사람의 주관적 판단과 명시적 규칙의 반복성 비교</title>
  <desc id="desc">왼쪽에서는 같은 차트를 두 분석자가 서로 다르게 판단하고, 오른쪽에서는 같은 입력과 고정 규칙이 두 번 모두 같은 매수 판단을 만든다.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto">
      <path d="M0 0L18 5L0 10Z" fill="context-stroke"/>
    </marker>
    <style>
      text { font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif; fill:#0F172A; }
      .title { font-size:34px; font-weight:700; }
      .body { font-size:26px; font-weight:400; fill:#52606D; }
      .node-title { font-size:28px; font-weight:700; }
      .node-body { font-size:24px; font-weight:400; fill:#52606D; }
      .result { font-size:26px; font-weight:700; }
      .panel { stroke-width:1.5; }
      .node { fill:#FFFFFF; stroke:#C7D2E1; stroke-width:1.5; }
      .rose-flow { fill:none; stroke:#BE123C; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .rose-trunk { fill:none; stroke:#BE123C; stroke-width:3; stroke-linecap:round; }
      .teal-flow { fill:none; stroke:#0B7A6A; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .teal-trunk { fill:none; stroke:#0B7A6A; stroke-width:3; stroke-linecap:round; }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#FFFFFF"/>

  <g>
    <rect class="panel" x="24" y="24" width="552" height="572" rx="12" fill="#FFF1F4" stroke="#BE123C"/>
    <text class="title" x="300" y="77" text-anchor="middle">사람의 주관적 판단</text>
    <text class="body" x="300" y="113" text-anchor="middle">같은 차트 · 기준은 사람마다 다름</text>

    <rect class="node" x="175" y="148" width="250" height="96" rx="12"/>
    <text class="node-body" x="300" y="181" text-anchor="middle">동일한 가격 차트</text>
    <polyline points="210,226 246,210 278,219 314,184 350,219 390,205" fill="none" stroke="#BE123C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <path class="rose-trunk" d="M300 244V304"/>
    <path class="rose-flow" d="M300 304H168V356"/>
    <path class="rose-flow" d="M300 304H432V356"/>

    <rect class="node" x="86" y="356" width="164" height="92" rx="12"/>
    <text class="node-title" x="168" y="394" text-anchor="middle">분석자 A</text>
    <text class="node-body" x="168" y="427" text-anchor="middle">상승 전환</text>

    <rect class="node" x="350" y="356" width="164" height="92" rx="12"/>
    <text class="node-title" x="432" y="394" text-anchor="middle">분석자 B</text>
    <text class="node-body" x="432" y="427" text-anchor="middle">하락 지속</text>

    <rect x="132" y="500" width="336" height="60" rx="30" fill="#FFFFFF" stroke="#BE123C" stroke-width="1.5"/>
    <text class="result" x="300" y="540" text-anchor="middle" fill="#BE123C">같은 차트도 판단이 달라짐</text>
  </g>

  <g>
    <rect class="panel" x="624" y="24" width="552" height="572" rx="12" fill="#E4F6F0" stroke="#0B7A6A"/>
    <text class="title" x="900" y="77" text-anchor="middle">명시적 퀀트 규칙</text>
    <text class="body" x="900" y="113" text-anchor="middle">같은 입력 · 판단 기준을 규칙에 명시</text>

    <rect class="node" x="672" y="160" width="180" height="92" rx="12"/>
    <text class="node-body" x="762" y="194" text-anchor="middle">동일한 입력</text>
    <text class="node-title" x="762" y="229" text-anchor="middle">가격 배열 X</text>

    <path class="teal-flow" d="M852 206H948"/>

    <rect class="node" x="948" y="160" width="180" height="92" rx="12" fill="#E7EEF9"/>
    <text class="node-body" x="1038" y="194" text-anchor="middle">고정된 규칙</text>
    <text class="node-title" x="1038" y="229" text-anchor="middle">f(X)</text>

    <path class="teal-trunk" d="M1038 252V304"/>
    <path class="teal-flow" d="M1038 304H762V356"/>
    <path class="teal-flow" d="M1038 304V356"/>

    <rect class="node" x="680" y="356" width="164" height="92" rx="12"/>
    <text class="node-title" x="762" y="394" text-anchor="middle">실행 1</text>
    <text class="node-body" x="762" y="427" text-anchor="middle">매수</text>

    <rect class="node" x="956" y="356" width="164" height="92" rx="12"/>
    <text class="node-title" x="1038" y="394" text-anchor="middle">실행 2</text>
    <text class="node-body" x="1038" y="427" text-anchor="middle">매수</text>

    <rect x="732" y="500" width="336" height="60" rx="30" fill="#FFFFFF" stroke="#0B7A6A" stroke-width="1.5"/>
    <text class="result" x="900" y="540" text-anchor="middle" fill="#0B7A6A">같은 입력이면 같은 판단</text>
  </g>
</svg>
