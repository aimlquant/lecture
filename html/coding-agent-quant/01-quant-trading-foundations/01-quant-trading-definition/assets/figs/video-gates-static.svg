  <title id="title">네 관문이 검증 가능한 전략 후보로 모이는 구조</title>
  <desc id="desc">최종 영상 s23의 네 카드와 공통 브래킷을 사용해 입력, 판단 기준, 행동, 과거 검증이 모두 이어져야 검증 가능한 전략 후보가 되는 구조를 보여 준다.</desc>
