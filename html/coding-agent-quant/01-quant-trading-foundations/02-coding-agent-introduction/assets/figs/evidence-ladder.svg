<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">완료 여부를 확인하는 다섯 단계의 증거</title>
  <desc id="desc">최종 영상 s20의 안정 화면을 바탕으로 완료 요약부터 파일과 바뀐 내용, 실행 기록, 화면 결과, 요구 조건 대조까지 폭이 넓어지는 다섯 단계를 옮겼다.</desc>
  <metadata>HyperFrames s20 · final-video SHA256 b72a38f75ac25fe46dc6a2264530656f7ea3a609da455088fc7e97a36f7a8dde</metadata>
