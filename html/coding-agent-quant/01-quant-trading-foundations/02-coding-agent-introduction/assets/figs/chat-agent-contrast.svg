  <title id="title">대화형 응답과 코딩 에이전트 작업의 차이</title>
  <desc id="desc">최종 영상 s07의 안정 화면을 바탕으로 설명과 예시를 사용자가 옮겨 실행하는 흐름과 파일, 변경 내용, 실행 기록을 남기는 에이전트 흐름을 나란히 비교한다.</desc>
