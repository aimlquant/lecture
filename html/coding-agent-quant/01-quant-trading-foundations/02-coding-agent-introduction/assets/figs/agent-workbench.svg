<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">코딩 에이전트의 작업면</title>
  <desc id="desc">왼쪽의 사용자 요청과 프로젝트 문맥이 가운데 코딩 에이전트로 들어가고, 에이전트는 오른쪽의 파일과 명령 도구를 사용한 뒤 아래에 검토 가능한 결과를 남긴다.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto">
      <path d="M0 0L18 5L0 10Z" fill="context-stroke"/>
    </marker>
    <style>
      text{font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif;fill:#0F172A;font-weight:400}
      .label{font-size:29px;font-weight:700}
      .small{font-size:22px;fill:#52606D}
      .input{fill:#E7EEF9;stroke:#0F2C59;stroke-width:2}
      .agent{fill:#E4F6F0;stroke:#0B7A6A;stroke-width:3}
      .tool{fill:#FFF0DF;stroke:#B45309;stroke-width:2}
      .result{fill:#FFFFFF;stroke:#0F2C59;stroke-width:3}
      .in{fill:none;stroke:#0F2C59;stroke-width:3;marker-end:url(#arrow)}
      .out{fill:none;stroke:#0B7A6A;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#FFFFFF"/>

  <rect class="input" x="55" y="120" width="320" height="120" rx="14"/>
  <text class="label" x="215" y="170" text-anchor="middle">작업 요청</text>
  <text class="small" x="215" y="207" text-anchor="middle">목적·범위·완료 조건</text>
  <rect class="input" x="55" y="330" width="320" height="120" rx="14"/>
  <text class="label" x="215" y="380" text-anchor="middle">프로젝트 문맥</text>
  <text class="small" x="215" y="417" text-anchor="middle">열린 파일·선택 영역·안내 문서</text>

  <rect class="agent" x="455" y="205" width="290" height="190" rx="16"/>
  <text class="label" x="600" y="275" text-anchor="middle">코딩 에이전트</text>
  <text class="small" x="600" y="318" text-anchor="middle">계획하고 도구를 고른다</text>
  <text class="small" x="600" y="354" text-anchor="middle">실패하면 다시 시도한다</text>

  <rect class="tool" x="825" y="120" width="320" height="120" rx="14"/>
  <text class="label" x="985" y="170" text-anchor="middle">파일 도구</text>
  <text class="small" x="985" y="207" text-anchor="middle">찾기·읽기·만들기·수정</text>
  <rect class="tool" x="825" y="330" width="320" height="120" rx="14"/>
  <text class="label" x="985" y="380" text-anchor="middle">명령 도구</text>
  <text class="small" x="985" y="417" text-anchor="middle">실행·검사·오류 확인</text>

  <path class="in" d="M375 180H420V255H455"/>
  <path class="in" d="M375 390H420V345H455"/>
  <path class="out" d="M745 255H785V180H825"/>
  <path class="out" d="M745 345H785V390H825"/>

  <path class="out" d="M600 395V525"/>
  <rect class="result" x="350" y="525" width="500" height="120" rx="14"/>
  <text class="label" x="600" y="574" text-anchor="middle">검토 가능한 결과</text>
  <text class="small" x="600" y="612" text-anchor="middle">파일·변경 내역·명령 기록·화면 출력</text>
</svg>
