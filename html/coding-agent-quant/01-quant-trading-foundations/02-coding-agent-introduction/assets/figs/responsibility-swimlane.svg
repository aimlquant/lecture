  <title id="title">사람과 코딩 에이전트의 역할 분담</title>
  <desc id="desc">최종 영상 s16의 안정 화면을 바탕으로 사람의 목표와 범위에서 시작해 에이전트의 계획, 파일과 명령, 결과 정리를 거친 뒤 사람의 검토와 결정으로 돌아오는 흐름을 옮겼다.</desc>
