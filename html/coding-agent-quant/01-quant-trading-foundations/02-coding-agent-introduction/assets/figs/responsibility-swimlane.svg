<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">사람과 코딩 에이전트의 책임 작업선</title>
  <desc id="desc">위쪽 사람 작업선에서 목표와 경계를 정한 뒤 아래쪽 에이전트 작업선의 계획, 파일과 명령, 결과 보고를 거쳐 다시 사람의 검토와 결정으로 돌아온다.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto">
      <path d="M0 0L18 5L0 10Z" fill="context-stroke"/>
    </marker>
    <style>
      text{font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif;fill:#0F172A;font-weight:400}
      .lane-human{fill:#E7EEF9;stroke:#C7D2E1;stroke-width:2}
      .lane-agent{fill:#E4F6F0;stroke:#C7D2E1;stroke-width:2}
      .human{fill:#FFFFFF;stroke:#0F2C59;stroke-width:3}
      .agent{fill:#FFFFFF;stroke:#0B7A6A;stroke-width:3}
      .lane{font-size:24px;font-weight:700}
      .label{font-size:27px;font-weight:700}
      .small{font-size:21px;fill:#52606D}
      .human-line{fill:none;stroke:#0F2C59;stroke-width:3;marker-end:url(#arrow)}
      .agent-line{fill:none;stroke:#0B7A6A;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <rect class="lane-human" x="40" y="55" width="1120" height="265" rx="15"/>
  <rect class="lane-agent" x="40" y="365" width="1120" height="265" rx="15"/>
  <text class="lane" x="75" y="98" fill="#0F2C59">사람</text>
  <text class="lane" x="75" y="408" fill="#0B7A6A">코딩 에이전트</text>

  <rect class="human" x="105" y="140" width="320" height="125" rx="14"/>
  <text class="label" x="265" y="189" text-anchor="middle">목표와 경계를 정한다</text>
  <text class="small" x="265" y="229" text-anchor="middle">목적 · 범위 · 완료 조건</text>

  <rect class="agent" x="105" y="450" width="250" height="125" rx="14"/>
  <rect class="agent" x="475" y="450" width="250" height="125" rx="14"/>
  <rect class="agent" x="845" y="450" width="250" height="125" rx="14"/>
  <text class="label" x="230" y="499" text-anchor="middle">계획</text><text class="small" x="230" y="539" text-anchor="middle">단계와 필요한 도구</text>
  <text class="label" x="600" y="499" text-anchor="middle">파일·명령</text><text class="small" x="600" y="539" text-anchor="middle">만들기 · 실행 · 수정</text>
  <text class="label" x="970" y="499" text-anchor="middle">결과 보고</text><text class="small" x="970" y="539" text-anchor="middle">산출물 · 검사 · 한계</text>

  <rect class="human" x="775" y="140" width="320" height="125" rx="14"/>
  <text class="label" x="935" y="189" text-anchor="middle">검토하고 결정한다</text>
  <text class="small" x="935" y="229" text-anchor="middle">수락 · 수정 · 되돌리기 · 중단</text>

  <path class="human-line" d="M265 265V400H230V450"/>
  <path class="agent-line" d="M355 512.5H475"/>
  <path class="agent-line" d="M725 512.5H845"/>
  <path class="agent-line" d="M970 450V330H935V265"/>
</svg>
