<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">코딩 에이전트가 일을 이어 가는 기본 순환</title>
  <desc id="desc">사람이 작업을 요청하면 에이전트가 현재 상태를 확인하고 다음 작업을 정한다. 파일이나 명령 도구를 사용한 결과를 다시 확인하며, 할 일이 남았으면 순환을 반복하고 끝났으면 사람이 결과를 검토한다.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto">
      <path d="M0 0L18 5L0 10Z" fill="context-stroke"/>
    </marker>
    <style>
      text{font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif;fill:#0F172A;font-weight:400}
      .state{fill:#E7EEF9;stroke:#0F2C59;stroke-width:2}
      .act{fill:#E4F6F0;stroke:#0B7A6A;stroke-width:2}
      .human{fill:#FFF0DF;stroke:#B45309;stroke-width:3}
      .num{font-size:21px;font-weight:700;fill:#52606D}
      .label{font-size:25px;font-weight:700}
      .small{font-size:20px;fill:#52606D}
      .line{fill:none;stroke:#0F2C59;stroke-width:3;marker-end:url(#arrow)}
      .feedback{fill:none;stroke:#0B7A6A;stroke-width:3;marker-end:url(#arrow)}
      .human-line{fill:none;stroke:#B45309;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#FFFFFF"/>

  <rect class="state" x="45" y="105" width="250" height="130" rx="13"/>
  <rect class="state" x="335" y="105" width="250" height="130" rx="13"/>
  <rect class="act" x="625" y="105" width="250" height="130" rx="13"/>
  <rect class="act" x="905" y="105" width="250" height="130" rx="13"/>

  <text class="num" x="65" y="137">01</text>
  <text class="label" x="170" y="176" text-anchor="middle">현재 상태 확인</text>
  <text class="small" x="170" y="209" text-anchor="middle">요청 · 파일 · 실행 결과</text>
  <text class="num" x="355" y="137">02</text>
  <text class="label" x="460" y="176" text-anchor="middle">다음 작업 정하기</text>
  <text class="small" x="460" y="209" text-anchor="middle">무엇을 할지 판단</text>
  <text class="num" x="645" y="137">03</text>
  <text class="label" x="750" y="176" text-anchor="middle">도구 사용</text>
  <text class="small" x="750" y="209" text-anchor="middle">파일 읽기·수정 · 명령 실행</text>
  <text class="num" x="925" y="137">04</text>
  <text class="label" x="1030" y="176" text-anchor="middle">결과 확인</text>
  <text class="small" x="1030" y="209" text-anchor="middle">바뀐 파일 · 오류 · 검사 결과</text>

  <path class="line" d="M295 170H335"/>
  <path class="line" d="M585 170H625"/>
  <path class="line" d="M875 170H905"/>
  <path class="feedback" d="M965 235V355H460V235"/>
  <text class="small" x="712" y="340" text-anchor="middle" fill="#0B7A6A">할 일이 남았으면 다시 판단한다</text>

  <rect class="human" x="45" y="500" width="250" height="115" rx="14"/>
  <text class="label" x="170" y="548" text-anchor="middle">사람의 작업 요청</text>
  <text class="small" x="170" y="583" text-anchor="middle">목적 · 범위 · 완료 조건</text>
  <path class="human-line" d="M170 500V235"/>

  <rect class="human" x="905" y="500" width="250" height="115" rx="14"/>
  <text class="label" x="1030" y="548" text-anchor="middle">사람의 결과 검토</text>
  <text class="small" x="1030" y="583" text-anchor="middle">수락 · 수정 · 되돌리기</text>
  <path class="human-line" d="M1030 235V500"/>
  <text class="small" x="1015" y="420" text-anchor="end" fill="#B45309">끝났으면</text>
</svg>
