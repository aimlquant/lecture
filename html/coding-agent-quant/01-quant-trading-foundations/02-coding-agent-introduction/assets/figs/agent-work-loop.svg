<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">코딩 에이전트의 작업 반복</title>
  <desc id="desc">요청 이해, 파일 확인, 변경, 실행, 결과 보고가 왼쪽에서 오른쪽으로 이어지고 사람의 검토에서 수락하거나 수정 요청을 첫 단계로 되돌린다.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto">
      <path d="M0 0L18 5L0 10Z" fill="context-stroke"/>
    </marker>
    <style>
      text{font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif;fill:#0F172A;font-weight:400}
      .step{fill:#E7EEF9;stroke:#0F2C59;stroke-width:2}
      .run{fill:#E4F6F0;stroke:#0B7A6A;stroke-width:2}
      .review{fill:#FFF0DF;stroke:#B45309;stroke-width:3}
      .num{font-size:21px;font-weight:700;fill:#52606D}
      .label{font-size:25px;font-weight:700}
      .small{font-size:21px;fill:#52606D}
      .line{fill:none;stroke:#0F2C59;stroke-width:3;marker-end:url(#arrow)}
      .feedback{fill:none;stroke:#B45309;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#FFFFFF"/>

  <rect class="step" x="45" y="105" width="190" height="130" rx="13"/>
  <rect class="step" x="275" y="105" width="190" height="130" rx="13"/>
  <rect class="run" x="505" y="105" width="190" height="130" rx="13"/>
  <rect class="run" x="735" y="105" width="190" height="130" rx="13"/>
  <rect class="step" x="965" y="105" width="190" height="130" rx="13"/>

  <text class="num" x="65" y="137">01</text><text class="label" x="140" y="180" text-anchor="middle">요청 이해</text><text class="small" x="140" y="211" text-anchor="middle">목적·범위</text>
  <text class="num" x="295" y="137">02</text><text class="label" x="370" y="180" text-anchor="middle">파일 확인</text><text class="small" x="370" y="211" text-anchor="middle">문맥·기존 규칙</text>
  <text class="num" x="525" y="137">03</text><text class="label" x="600" y="180" text-anchor="middle">변경</text><text class="small" x="600" y="211" text-anchor="middle">파일 만들기·수정</text>
  <text class="num" x="755" y="137">04</text><text class="label" x="830" y="180" text-anchor="middle">실행</text><text class="small" x="830" y="211" text-anchor="middle">명령·오류 확인</text>
  <text class="num" x="985" y="137">05</text><text class="label" x="1060" y="180" text-anchor="middle">결과 보고</text><text class="small" x="1060" y="211" text-anchor="middle">산출물·검사·한계</text>

  <path class="line" d="M235 170H275"/><path class="line" d="M465 170H505"/>
  <path class="line" d="M695 170H735"/><path class="line" d="M925 170H965"/>

  <path class="line" d="M1060 235V330H600V395"/>
  <rect class="review" x="425" y="395" width="350" height="120" rx="14"/>
  <text class="label" x="600" y="443" text-anchor="middle">사람이 검토한다</text>
  <text class="small" x="600" y="483" text-anchor="middle">수락 · 수정 요청 · 되돌리기 · 중단</text>

  <path class="feedback" d="M425 455H140V235"/>
  <text class="small" x="275" y="438" text-anchor="middle" fill="#B45309">수정 요청</text>
</svg>
