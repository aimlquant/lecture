<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">할 수 있는 일과 해도 되는 일 사이의 권한 경계</title>
  <desc id="desc">최종 영상 s22의 안정 화면을 바탕으로 정해진 범위 안의 작업과 사람 확인에서 멈춰야 하는 범위를 중앙의 정지선으로 나눈다.</desc>
