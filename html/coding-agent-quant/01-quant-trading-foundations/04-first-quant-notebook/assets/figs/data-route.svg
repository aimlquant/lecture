<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">KODEX 200 상품 확인과 두 데이터 경로</title>
  <desc id="desc">왼쪽의 KODEX 200 상품 카드에서 오른쪽 위의 KRX 공식 API와 오른쪽 아래의 FinanceDataReader NAVER 실습 경로로 연결된다.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto">
      <path d="M0 0L18 5L0 10Z" fill="#0F2C59"/>
    </marker>
    <style>
      text{font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif;fill:#0F172A}
      .kicker{font-size:21px;font-weight:700;fill:#0F2C59}
      .title{font-size:34px;font-weight:700}
      .sub{font-size:21px;font-weight:400;fill:#52606D}
      .tag{font-size:19px;font-weight:700}
      .arrow{fill:none;stroke:#0F2C59;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#FFFFFF"/>

  <rect x="55" y="220" width="320" height="280" rx="16" fill="#E7EEF9" stroke="#0F2C59" stroke-width="2"/>
  <text class="kicker" x="85" y="267">공식 상품 페이지에서 확인</text>
  <text class="title" x="85" y="334">KODEX 200</text>
  <text class="title" x="85" y="380">069500</text>
  <text class="sub" x="85" y="431">KOSPI 200 추적 ETF</text>
  <rect x="85" y="453" width="170" height="32" rx="16" fill="#FFFFFF" stroke="#C7D2E1"/>
  <text class="tag" x="170" y="476" text-anchor="middle" fill="#0F2C59">종목 정보 확인</text>

  <rect x="560" y="75" width="585" height="245" rx="16" fill="#FFF0DF" stroke="#B45309" stroke-width="2"/>
  <text class="kicker" x="592" y="120" fill="#B45309">공식 데이터 경로</text>
  <text class="title" x="592" y="169">KRX OPEN API</text>
  <text class="sub" x="592" y="215">ETF 일별매매정보</text>
  <text class="sub" x="592" y="252">회원가입 · 인증키 · 서비스 승인 필요</text>
  <rect x="943" y="112" width="166" height="34" rx="17" fill="#FFFFFF" stroke="#B45309"/>
  <text class="tag" x="1026" y="136" text-anchor="middle" fill="#B45309">심화 경로</text>

  <rect x="560" y="400" width="585" height="245" rx="16" fill="#E4F6F0" stroke="#0B7A6A" stroke-width="2"/>
  <text class="kicker" x="592" y="445" fill="#0B7A6A">이번 영상의 실습 경로</text>
  <text class="title" x="592" y="494">FinanceDataReader</text>
  <text class="sub" x="592" y="540">NAVER:069500 · 버전 0.9.202</text>
  <text class="sub" x="592" y="577">로그인 없이 지정 기간을 로컬 CSV로 저장</text>
  <rect x="943" y="437" width="166" height="34" rx="17" fill="#FFFFFF" stroke="#0B7A6A"/>
  <text class="tag" x="1026" y="461" text-anchor="middle" fill="#0B7A6A">이번 선택</text>

  <path class="arrow" d="M375 360H452V198H560"/>
  <path class="arrow" d="M375 360H452V522H560"/>
  <rect x="397" y="172" width="112" height="30" rx="15" fill="#FFFFFF" stroke="#C7D2E1"/>
  <text class="tag" x="453" y="194" text-anchor="middle" fill="#52606D">공식 경로</text>
  <rect x="397" y="509" width="112" height="30" rx="15" fill="#FFFFFF" stroke="#C7D2E1"/>
  <text class="tag" x="453" y="531" text-anchor="middle" fill="#52606D">첫 실습</text>
</svg>
