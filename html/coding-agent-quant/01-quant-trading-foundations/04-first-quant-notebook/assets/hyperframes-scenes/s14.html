    <script>(function(){
var root=document.getElementById("scene-s14");
var q=function(s){return root.querySelector(s);};
var duration=6.400;
var tl=gsap.timeline({paused:true});

var NS="http://www.w3.org/2000/svg",wipeSeq=0;
function A(sel,scope){return Array.prototype.slice.call((scope||root).querySelectorAll(sel));}
function isDashed(shape){
  var dash=window.getComputedStyle(shape).strokeDasharray;
  return !!(dash&&dash!=="none"&&dash!=="0px"&&dash!=="0"&&dash.indexOf(",")!==-1||
            dash&&dash!=="none"&&dash!=="0px"&&dash!=="0"&&dash.indexOf(" ")!==-1);
}
function markerAfter(shape,at){
  var marker=window.getComputedStyle(shape).markerEnd;
  if(!marker||marker==="none")return;
  gsap.set(shape,{markerEnd:"none"});
  tl.set(shape,{markerEnd:marker},at);
}
/* Solid connector: the shaft draws, and only then does the arrowhead exist. */
function draw(shape,at,dur,ease){
  var len=0;try{len=shape.getTotalLength();}catch(e){return;}
  if(!len)return;
  markerAfter(shape,at+dur+0.06);
  shape.style.strokeDasharray=len;shape.style.strokeDashoffset=len;
  tl.to(shape,{strokeDashoffset:0,duration:dur,ease:ease||"power2.out"},at);
}
/* Dashed connector: keep the dash pattern (it means "not done yet") and slide it
   in from its own start point instead of overwriting stroke-dasharray. */
function slideStroke(shape,at,dur,dx,dy){
  markerAfter(shape,at+dur*0.82);
  tl.fromTo(shape,{opacity:0,x:dx||-14,y:dy||0},
    {opacity:1,x:0,y:0,duration:dur,ease:"power2.out"},at);
}
function drawOrSlide(shape,at,dur,dx){
  if(isDashed(shape))slideStroke(shape,at,dur,dx);else draw(shape,at,dur);
}
function strokesOf(node){return A("path,line,polyline",node);}
/* A data token that rides a connector so the hand-off is visible, not implied. */
function travel(shape,at,dur,color,radius){
  var len=0;try{len=shape.getTotalLength();}catch(e){return;}
  if(!len)return;
  var dot=document.createElementNS(NS,"circle");
  dot.setAttribute("class","flow-token");
  dot.setAttribute("r",radius||7);
  dot.setAttribute("fill",color||"#0F2C59");
  dot.setAttribute("opacity","0");
  shape.parentNode.appendChild(dot);
  var p0=shape.getPointAtLength(0);
  dot.setAttribute("cx",p0.x);dot.setAttribute("cy",p0.y);
  var st={t:0};
  tl.to(dot,{opacity:1,duration:.12,ease:"none"},at);
  tl.to(st,{t:1,duration:dur,ease:"power1.inOut",onUpdate:function(){
    var p=shape.getPointAtLength(st.t*len);
    dot.setAttribute("cx",p.x);dot.setAttribute("cy",p.y);
  }},at);
  tl.to(dot,{opacity:0,duration:.16,ease:"none"},at+dur-0.06);
}
/* Left-to-right reveal that preserves the artwork instead of fading it. */
function clipWipe(el,at,dur,ease){
  var svg=el.ownerSVGElement;if(!svg)return;
  var box;try{box=el.getBBox();}catch(e){return;}
  var defs=svg.querySelector("defs");
  if(!defs){defs=document.createElementNS(NS,"defs");svg.insertBefore(defs,svg.firstChild);}
  var id="hf-wipe-"+(++wipeSeq);
  var clip=document.createElementNS(NS,"clipPath");
  clip.setAttribute("id",id);clip.setAttribute("clipPathUnits","userSpaceOnUse");
  var rect=document.createElementNS(NS,"rect");
  rect.setAttribute("x",box.x-3);rect.setAttribute("y",box.y-3);
  rect.setAttribute("height",box.height+6);rect.setAttribute("width",0);
  clip.appendChild(rect);defs.appendChild(clip);
  el.setAttribute("clip-path","url(#"+id+")");
  tl.to(rect,{attr:{width:box.width+6},duration:dur,ease:ease||"power2.out"},at);
}
/* Card entrance vocabulary. Each scene picks verbs that match its own logic. */
var ENTRANCE={
  riseLeft:{x:-52,y:0,scale:.955,ease:"power3.out",duration:.52},
  riseRight:{x:52,y:0,scale:.955,ease:"power3.out",duration:.52},
  riseUp:{x:0,y:34,scale:.955,ease:"power3.out",duration:.5},
  riseUpRight:{x:34,y:-30,scale:.95,ease:"power3.out",duration:.54},
  riseDownRight:{x:34,y:30,scale:.95,ease:"power3.out",duration:.54},
  settle:{x:0,y:16,scale:.985,ease:"power2.out",duration:.44},
  land:{x:0,y:-26,scale:1.35,ease:"power4.out",duration:.5}
};
function enter(node,at,verb,ghost){
  var p=ENTRANCE[verb]||ENTRANCE.riseUp;
  if(ghost){
    /* The slot is already on screen as a ghost, so it fills in place. */
    tl.fromTo(node,{opacity:ghost,scale:.985,transformOrigin:"50% 50%"},
      {opacity:1,scale:1,duration:p.duration,ease:p.ease},at);
    return;
  }
  tl.fromTo(node,{opacity:0,x:p.x,y:p.y,scale:p.scale,transformOrigin:"50% 50%"},
    {opacity:1,x:0,y:0,scale:1,duration:p.duration,ease:p.ease},at);
}
/* Icon-internal beats: outline strokes draw, then dots and chips resolve. */
function iconDetail(node,at){
  var strokes=A(".icon path,.icon line,.icon polyline,.icon-ok path,.icon-ok line,"+
    ".icon-ok polyline,.icon-warn path,.icon-warn line,.icon-wait path,.icon-wait line,"+
    "path.icon-ok,path.icon-warn,path.icon-wait",node);
  strokes.forEach(function(shape,i){draw(shape,at+0.16+i*0.06,0.42);});
  var pops=A(".icon circle,.icon ellipse,.icon rect,.icon-ok circle,.icon-ok ellipse,"+
    ".icon-ok rect,.icon-warn circle,.icon-warn ellipse,.icon-warn rect,"+
    ".icon-wait circle,.icon-wait ellipse,.icon-wait rect",node);
  pops.forEach(function(part,i){
    tl.fromTo(part,{opacity:0,scale:.7,transformBox:"fill-box",transformOrigin:"50% 50%"},
      {opacity:1,scale:1,duration:.3,ease:"back.out(1.5)"},at+0.24+i*0.05);
  });
}
/* The small status pill is the conclusion of a card, so it lands last. */
function statusChip(node,at){
  var chips=A("rect[rx='15'],rect[rx='16'],rect[rx='18'],rect[rx='19']",node);
  var labels=A("text.tag,text.chip,text.status,text.kicker,text.meta",node);
  chips.slice(-1).forEach(function(part){
    tl.fromTo(part,{opacity:0,scale:.86,transformBox:"fill-box",transformOrigin:"50% 50%"},
      {opacity:1,scale:1,duration:.34,ease:"back.out(1.4)"},at);
  });
  labels.slice(-1).forEach(function(part){
    tl.fromTo(part,{opacity:0,y:5},{opacity:1,y:0,duration:.28,ease:"power3.out"},at+.06);
  });
}
function ambient(seedX,seedY,orbEase){
  tl.fromTo(q(".hf-grid"),{x:seedX,y:seedY},
    {x:-seedX,y:-seedY,duration:duration,ease:"none"},0);
  tl.fromTo(q(".hf-orb"),{scale:.93,opacity:.26},
    {scale:1.06,opacity:.62,duration:duration,ease:orbEase||"sine.inOut"},0);
}
function headerIn(at){
  tl.fromTo(q(".hf-header"),{opacity:0,y:26},{opacity:1,y:0,duration:.55,ease:"power3.out"},at||.12);
}
function shellIn(at){
  tl.fromTo(q(".figure-shell"),{opacity:0,y:18,scale:.994},
    {opacity:1,y:0,scale:1,duration:.52,ease:"power3.out"},at||.24);
}

ambient(-16,-12,"sine.inOut");tl.fromTo(q(".section-number"),{opacity:0,scale:.72,y:-34},{opacity:1,scale:1,y:0,duration:.58,ease:"back.out(1.3)"},.16);tl.fromTo(q(".section-rule"),{scaleX:0},{scaleX:1,duration:.62,ease:"power2.out"},.5);tl.fromTo(q(".section-title"),{opacity:0,y:36},{opacity:1,y:0,duration:.62,ease:"power3.out"},.76);tl.fromTo(q(".section-subtitle"),{opacity:0,y:18},{opacity:1,y:0,duration:.46,ease:"power3.out"},1.14);
window.__timelines=window.__timelines||{};
window.__timelines["slide-s14"]=tl;

<script>
(function() {
  "use strict";
  var slideId = "s14";
  var times = [6.28];
  var requested = Number(new URLSearchParams(window.location.search).get("step")) || 1;
  function clamp(step) { return Math.max(1, Math.min(times.length, Number(step) || 1)); }
  function apply(step) {
    var current = clamp(step);
    var timeline = window.__timelines && window.__timelines["slide-" + slideId];
    if (!timeline) return false;
    timeline.pause(times[current - 1], false);
    document.documentElement.setAttribute("data-presentation-step", String(current));
    document.documentElement.setAttribute("data-presentation-ready", "true");
    if (window.parent !== window) window.parent.postMessage({
      type:"aimlquant-hyperframes-ready", slideId:slideId, step:current
    }, "*");
    return true;
  }
  window.aimlquantHyperframesSetStep = apply;
  function boot() {
    var ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    ready.then(function() {
      requestAnimationFrame(function() { if (!apply(requested)) setTimeout(function() { apply(requested); }, 0); });
    });
  }
  window.addEventListener("message", function(event) {
    var data = event.data || {};
    if (data.type === "aimlquant-hyperframes-step") { requested = clamp(data.step); apply(requested); }
  });
  window.addEventListener("beforeprint", function() { apply(times.length); });
  window.addEventListener("keydown", function(event) {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight" && event.key.toLowerCase() !== "n") return;
    event.preventDefault();
    if (window.parent !== window) window.parent.postMessage({
      type:"aimlquant-hyperframes-key", key:event.key, slideId:slideId
    }, "*");
  });
  boot();
})();
