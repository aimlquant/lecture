<script>
(function() {
  "use strict";
  var slideId = "s09";
  var times = [9.8];
  var requested = Number(new URLSearchParams(window.location.search).get("step")) || 1;
  function clamp(step) { return Math.max(1, Math.min(times.length, Number(step) || 1)); }
  function apply(step) {
    var current = clamp(step);
    var timeline = window.__timelines && window.__timelines["slide-" + slideId];
    if (!timeline) return false;
    timeline.pause(times[current - 1], false);
    document.documentElement.setAttribute("data-presentation-step", String(current));
    document.documentElement.setAttribute("data-presentation-ready", "true");
    if (window.parent !== window) window.parent.postMessage({
      type:"aimlquant-hyperframes-ready", slideId:slideId, step:current
    }, "*");
    return true;
  }
  window.aimlquantHyperframesSetStep = apply;
  function boot() {
    var ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    ready.then(function() {
      requestAnimationFrame(function() { if (!apply(requested)) setTimeout(function() { apply(requested); }, 0); });
    });
  }
  window.addEventListener("message", function(event) {
    var data = event.data || {};
    if (data.type === "aimlquant-hyperframes-step") { requested = clamp(data.step); apply(requested); }
  });
  window.addEventListener("beforeprint", function() { apply(times.length); });
  window.addEventListener("keydown", function(event) {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight" && event.key.toLowerCase() !== "n") return;
    event.preventDefault();
    if (window.parent !== window) window.parent.postMessage({
      type:"aimlquant-hyperframes-key", key:event.key, slideId:slideId
    }, "*");
  });
  boot();
})();
