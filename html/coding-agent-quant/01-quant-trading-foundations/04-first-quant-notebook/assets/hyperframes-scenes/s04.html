    <script>(function(){

var NS="http://www.w3.org/2000/svg",wipeSeq=0;
function A(sel,scope){return Array.prototype.slice.call((scope||root).querySelectorAll(sel));}
function isDashed(shape){
  var dash=window.getComputedStyle(shape).strokeDasharray;
  return !!(dash&&dash!=="none"&&dash!=="0px"&&dash!=="0"&&dash.indexOf(",")!==-1||
            dash&&dash!=="none"&&dash!=="0px"&&dash!=="0"&&dash.indexOf(" ")!==-1);
}
function markerAfter(shape,at){
  var marker=window.getComputedStyle(shape).markerEnd;
  if(!marker||marker==="none")return;
  gsap.set(shape,{markerEnd:"none"});
  tl.set(shape,{markerEnd:marker},at);
}
/* Solid connector: the shaft draws, and only then does the arrowhead exist. */
function draw(shape,at,dur,ease){
  var len=0;try{len=shape.getTotalLength();}catch(e){return;}
  if(!len)return;
  markerAfter(shape,at+dur+0.06);
  shape.style.strokeDasharray=len;shape.style.strokeDashoffset=len;
  tl.to(shape,{strokeDashoffset:0,duration:dur,ease:ease||"power2.out"},at);
}
/* Dashed connector: keep the dash pattern (it means "not done yet") and slide it
   in from its own start point instead of overwriting stroke-dasharray. */
function slideStroke(shape,at,dur,dx,dy){
  markerAfter(shape,at+dur*0.82);
  tl.fromTo(shape,{opacity:0,x:dx||-14,y:dy||0},
    {opacity:1,x:0,y:0,duration:dur,ease:"power2.out"},at);
}
function drawOrSlide(shape,at,dur,dx){
  if(isDashed(shape))slideStroke(shape,at,dur,dx);else draw(shape,at,dur);
}
function strokesOf(node){return A("path,line,polyline",node);}
/* A data token that rides a connector so the hand-off is visible, not implied. */
function travel(shape,at,dur,color,radius){
  var len=0;try{len=shape.getTotalLength();}catch(e){return;}
  if(!len)return;
  var dot=document.createElementNS(NS,"circle");
  dot.setAttribute("class","flow-token");
  dot.setAttribute("r",radius||7);
  dot.setAttribute("fill",color||"#0F2C59");
  dot.setAttribute("opacity","0");
  shape.parentNode.appendChild(dot);
  var p0=shape.getPointAtLength(0);
  dot.setAttribute("cx",p0.x);dot.setAttribute("cy",p0.y);
  var st={t:0};
  tl.to(dot,{opacity:1,duration:.12,ease:"none"},at);
  tl.to(st,{t:1,duration:dur,ease:"power1.inOut",onUpdate:function(){
    var p=shape.getPointAtLength(st.t*len);
    dot.setAttribute("cx",p.x);dot.setAttribute("cy",p.y);
  }},at);
  tl.to(dot,{opacity:0,duration:.16,ease:"none"},at+dur-0.06);
}
/* Left-to-right reveal that preserves the artwork instead of fading it. */
function clipWipe(el,at,dur,ease){
  var svg=el.ownerSVGElement;if(!svg)return;
  var box;try{box=el.getBBox();}catch(e){return;}
  var defs=svg.querySelector("defs");
  if(!defs){defs=document.createElementNS(NS,"defs");svg.insertBefore(defs,svg.firstChild);}
  var id="hf-wipe-"+(++wipeSeq);

  clip.setAttribute("id",id);clip.setAttribute("clipPathUnits","userSpaceOnUse");
  var rect=document.createElementNS(NS,"rect");
  rect.setAttribute("x",box.x-3);rect.setAttribute("y",box.y-3);
  rect.setAttribute("height",box.height+6);rect.setAttribute("width",0);
  clip.appendChild(rect);defs.appendChild(clip);
  el.setAttribute("clip-path","url(#"+id+")");
  tl.to(rect,{attr:{width:box.width+6},duration:dur,ease:ease||"power2.out"},at);

/* Card entrance vocabulary. Each scene picks verbs that match its own logic. */
var ENTRANCE={
  riseLeft:{x:-52,y:0,scale:.955,ease:"power3.out",duration:.52},
  riseRight:{x:52,y:0,scale:.955,ease:"power3.out",duration:.52},
  riseUp:{x:0,y:34,scale:.955,ease:"power3.out",duration:.5},
  riseUpRight:{x:34,y:-30,scale:.95,ease:"power3.out",duration:.54},
  riseDownRight:{x:34,y:30,scale:.95,ease:"power3.out",duration:.54},

function iconDetail(node,at){

  var labels=A("text.tag,text.chip,text.status,text.kicker,text.meta",node);

      {opacity:1,scale:1,duration:.34,ease:"back.out(1.4)"},at);
  });
  labels.slice(-1).forEach(function(part){
    tl.fromTo(part,{opacity:0,y:5},{opacity:1,y:0,duration:.28,ease:"power3.out"},at+.06);
  });
}
function ambient(seedX,seedY,orbEase){
