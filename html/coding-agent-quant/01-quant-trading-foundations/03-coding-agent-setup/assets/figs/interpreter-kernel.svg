<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">컴퓨터의 Python과 프로젝트 전용 가상 환경의 관계</title>
  <desc id="desc">컴퓨터에 설치한 Python으로 프로젝트 전용 가상 환경을 만들고, 일반 Python 파일과 Jupyter 노트북에서 같은 환경을 선택한다.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto">
      <path d="M0 0L18 5L0 10Z" fill="#0F2C59"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK KR","Noto Sans KR",sans-serif; }
      .label { font-size: 21px; font-weight: 700; letter-spacing: .05em; fill: #0F2C59; }
      .name { font-size: 29px; font-weight: 700; fill: #0F172A; }
      .command { font-size: 21px; font-weight: 400; fill: #52606D; }
    </style>
  </defs>
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <path d="M360 145H449" fill="none" stroke="#0F2C59" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M600 220V265H310V329" fill="none" stroke="#0F2C59" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M600 220V265H890V329" fill="none" stroke="#0F2C59" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="60" y="70" width="300" height="150" rx="12" fill="#FFFFFF" stroke="#C7D2E1" stroke-width="2"/>
  <text class="label" x="95" y="115">컴퓨터에 설치한 도구</text>
  <text class="name" x="95" y="165">Python</text>
  <rect x="450" y="70" width="300" height="150" rx="12" fill="#E4F6F0" stroke="#0B7A6A" stroke-width="2"/>
  <text class="label" x="485" y="115" fill="#0B7A6A">이번 프로젝트의 도구 상자</text>
  <text class="name" x="485" y="165">.venv</text>
  <rect x="80" y="330" width="460" height="140" rx="12" fill="#E7EEF9" stroke="#0F2C59" stroke-width="2"/>
  <text class="label" x="115" y="375">일반 Python 파일</text>
  <text class="name" x="115" y="420">인터프리터로 선택</text>
  <text class="command" x="115" y="453">Python: Select Interpreter</text>
  <rect x="660" y="330" width="460" height="140" rx="12" fill="#E7EEF9" stroke="#0F2C59" stroke-width="2"/>
  <text class="label" x="695" y="375">Jupyter 노트북</text>
  <text class="name" x="695" y="420">커널로 선택</text>
  <text class="command" x="695" y="453">Select Kernel</text>
</svg>
