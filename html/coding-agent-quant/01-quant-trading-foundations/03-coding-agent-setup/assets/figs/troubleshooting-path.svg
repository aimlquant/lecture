<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">실습 환경 오류를 네 층으로 나누어 찾는 순서</title>
  <desc id="desc">폴더, Codex, 커널, 셀 실행을 차례로 확인하고 실패한 층 바로 아래의 복구 행동으로 이동한다.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto">
      <path d="M0 0L18 5L0 10Z" fill="#0F2C59"/>
    </marker>
    <marker id="warn-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto">
      <path d="M0 0L18 5L0 10Z" fill="#B45309"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK KR","Noto Sans KR",sans-serif; }
      .step { font-size: 20px; font-weight: 700; letter-spacing: .06em; fill: #0F2C59; }
      .question { font-size: 25px; font-weight: 700; fill: #0F172A; }
      .fix { font-size: 23px; font-weight: 700; fill: #0F172A; }
      .hint { font-size: 20px; font-weight: 400; fill: #52606D; }
    </style>
  </defs>
  <rect width="1200" height="650" fill="#FFFFFF"/>
  <path d="M280 160H329" fill="none" stroke="#0F2C59" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M570 160H619" fill="none" stroke="#0F2C59" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M860 160H909" fill="none" stroke="#0F2C59" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M160 235V359" fill="none" stroke="#B45309" stroke-width="2" marker-end="url(#warn-arrow)"/>
  <path d="M450 235V359" fill="none" stroke="#B45309" stroke-width="2" marker-end="url(#warn-arrow)"/>
  <path d="M740 235V359" fill="none" stroke="#B45309" stroke-width="2" marker-end="url(#warn-arrow)"/>
  <path d="M1030 235V359" fill="none" stroke="#B45309" stroke-width="2" marker-end="url(#warn-arrow)"/>
  <g>
    <rect x="40" y="80" width="240" height="155" rx="12" fill="#E7EEF9" stroke="#0F2C59" stroke-width="2"/>
    <text class="step" x="70" y="120">01</text>
    <text class="question" x="70" y="170">폴더명이</text>
    <text class="question" x="70" y="205">보이는가?</text>
  </g>
  <g>
    <rect x="330" y="80" width="240" height="155" rx="12" fill="#E7EEF9" stroke="#0F2C59" stroke-width="2"/>
    <text class="step" x="360" y="120">02</text>
    <text class="question" x="360" y="170">Codex 화면이</text>
    <text class="question" x="360" y="205">열리는가?</text>
  </g>
  <g>
    <rect x="620" y="80" width="240" height="155" rx="12" fill="#E7EEF9" stroke="#0F2C59" stroke-width="2"/>
    <text class="step" x="650" y="120">03</text>
    <text class="question" x="650" y="170">.venv 커널을</text>
    <text class="question" x="650" y="205">고를 수 있는가?</text>
  </g>
  <g>
    <rect x="910" y="80" width="240" height="155" rx="12" fill="#E4F6F0" stroke="#0B7A6A" stroke-width="2"/>
    <text class="step" x="940" y="120" fill="#0B7A6A">04</text>
    <text class="question" x="940" y="170">셀 출력이</text>
    <text class="question" x="940" y="205">나오는가?</text>
  </g>
  <g>
    <rect x="40" y="360" width="240" height="200" rx="12" fill="#FFF0DF" stroke="#B45309" stroke-width="2"/>
    <text class="fix" x="70" y="415">Open Folder</text>
    <text class="hint" x="70" y="462">강의 폴더를 다시</text>
    <text class="hint" x="70" y="494">하나만 연다</text>
  </g>
  <g>
    <rect x="330" y="360" width="240" height="200" rx="12" fill="#FFF0DF" stroke="#B45309" stroke-width="2"/>
    <text class="fix" x="360" y="415">확장 기능 확인</text>
    <text class="hint" x="360" y="462">openai.chatgpt와</text>
    <text class="hint" x="360" y="494">로그인 상태를 본다</text>
  </g>
  <g>
    <rect x="620" y="360" width="240" height="200" rx="12" fill="#FFF0DF" stroke="#B45309" stroke-width="2"/>
    <text class="fix" x="650" y="415">Python 환경 확인</text>
    <text class="hint" x="650" y="462">.venv와 ipykernel을</text>
    <text class="hint" x="650" y="494">확인한다</text>
  </g>
  <g>
    <rect x="910" y="360" width="240" height="200" rx="12" fill="#FFF0DF" stroke="#B45309" stroke-width="2"/>
    <text class="fix" x="940" y="415">오류 첫 줄 확인</text>
    <text class="hint" x="940" y="462">선택한 커널과</text>
    <text class="hint" x="940" y="494">실행 결과를 대조한다</text>
  </g>
</svg>
