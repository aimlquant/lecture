<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">문제를 찾는 세 단계</title>
  <desc id="desc">강의 화면과 내 화면을 비교하고, 처음 달라진 단계를 찾은 다음, 그 단계만 다시 확인하는 세 카드가 왼쪽에서 오른쪽으로 이어진다.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto">
      <path d="M0 0L18 5L0 10Z" fill="#0F2C59"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity=".08"/>
    </filter>
    <style>
      text { font-family: "Noto Sans CJK KR","Noto Sans KR",sans-serif; }
      .step { font-size: 18px; font-weight: 700; letter-spacing: .08em; fill: #0B7A6A; }
      .name { font-size: 28px; font-weight: 700; fill: #0F2C59; }
      .body { font-size: 20px; font-weight: 400; fill: #52606D; }
      .note { font-size: 22px; font-weight: 700; fill: #0F2C59; }
      .connector { fill: none; stroke: #0F2C59; stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <path class="connector" d="M370 220H424"/>
  <path class="connector" d="M777 220H831"/>
  <g filter="url(#shadow)">
    <rect x="35" y="90" width="335" height="260" rx="18" fill="#FFFFFF" stroke="#C7D2E1" stroke-width="2"/>
    <rect x="425" y="90" width="352" height="260" rx="18" fill="#FFFFFF" stroke="#C7D2E1" stroke-width="2"/>
    <rect x="832" y="90" width="333" height="260" rx="18" fill="#E4F6F0" stroke="#0B7A6A" stroke-width="2"/>
  </g>
  <text class="step" x="70" y="140">STEP 01</text>
  <text class="name" x="70" y="190">화면 비교</text>
  <text class="body" x="70" y="238">강의 화면과 내 화면에서</text>
  <text class="body" x="70" y="270">무엇이 다른지 본다</text>

  <text class="step" x="460" y="140">STEP 02</text>
  <text class="name" x="460" y="190">막힌 단계 찾기</text>
  <text class="body" x="460" y="238">처음 보이지 않거나 달라진</text>
  <text class="body" x="460" y="270">단계를 하나만 찾는다</text>

  <text class="step" x="867" y="140">STEP 03</text>
  <text class="name" x="867" y="190">그 단계만 확인</text>
  <text class="body" x="867" y="238">바로 앞 단계부터</text>
  <text class="body" x="867" y="270">다시 시도한다</text>

  <rect x="235" y="398" width="730" height="72" rx="36" fill="#E7EEF9"/>
  <circle cx="280" cy="434" r="18" fill="#B45309"/>
  <path d="M271 425L289 443M289 425L271 443" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <text class="note" x="320" y="442">프로그램을 전부 지우거나 처음부터 다시 설치하지 않는다</text>
</svg>
