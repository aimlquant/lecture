<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">VS Code와 Codex, Python, Jupyter의 관계</title>
  <desc id="desc">VS Code라는 작업 화면 안에서 Codex는 코딩을 돕고, Python은 코드를 실행하며, Jupyter는 설명과 코드와 결과를 한 문서에 보여 준다.</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans CJK KR","Noto Sans KR",sans-serif; }
      .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: .07em; fill: #0F2C59; }
      .title { font-size: 34px; font-weight: 700; fill: #0F172A; }
      .name { font-size: 28px; font-weight: 700; fill: #0F172A; }
      .body { font-size: 21px; font-weight: 400; fill: #52606D; }
    </style>
  </defs>
  <rect width="1200" height="500" fill="#FFFFFF"/>
  <rect x="50" y="45" width="1100" height="410" rx="18" fill="#E7EEF9" stroke="#0F2C59" stroke-width="3"/>
  <text class="eyebrow" x="90" y="92">강의 파일을 열고 작업하는 화면</text>
  <text class="title" x="90" y="140">VS Code</text>
  <g>
    <rect x="90" y="185" width="300" height="210" rx="12" fill="#FFFFFF" stroke="#C7D2E1" stroke-width="2"/>
    <text class="eyebrow" x="120" y="230">코딩 에이전트</text>
    <text class="name" x="120" y="278">Codex</text>
    <text class="body" x="120" y="326">부탁을 읽고 파일과</text>
    <text class="body" x="120" y="358">코드를 함께 다룬다</text>
  </g>
  <g>
    <rect x="450" y="185" width="300" height="210" rx="12" fill="#FFFFFF" stroke="#C7D2E1" stroke-width="2"/>
    <text class="eyebrow" x="480" y="230">프로그래밍 언어</text>
    <text class="name" x="480" y="278">Python</text>
    <text class="body" x="480" y="326">퀀트 코드를 적고</text>
    <text class="body" x="480" y="358">실제로 실행한다</text>
  </g>
  <g>
    <rect x="810" y="185" width="300" height="210" rx="12" fill="#E4F6F0" stroke="#0B7A6A" stroke-width="2"/>
    <text class="eyebrow" x="840" y="230">설명과 실행 결과</text>
    <text class="name" x="840" y="278">Jupyter</text>
    <text class="body" x="840" y="326">설명과 코드를 나누어</text>
    <text class="body" x="840" y="358">한 문서에서 확인한다</text>
  </g>
</svg>
